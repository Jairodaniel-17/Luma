[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-sdk"
version = "3.0.0"
description = "Python SDK for the Luma convergent data engine"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3",
    "numpy>=1.24",
]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "langchain-core>=0.3",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
