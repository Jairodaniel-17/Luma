[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-vdb"
version = "4.0.0"
description = "Python SDK for the Luma convergent data engine — vectors, KV state, SQL, docs, agent memory, and pub/sub in one binary"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Luma contributors" },
]
keywords = [
    "vector-database",
    "embeddings",
    "agent-memory",
    "key-value",
    "sqlite",
    "sse",
    "ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "typing_extensions>=4.6; python_version < '3.11'",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3",
    "numpy>=1.24",
]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.8",
    "ruff>=0.4",
    "langchain-core>=0.3",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Jairodaniel-17/rust-kiss-vdb"
Documentation = "https://github.com/Jairodaniel-17/rust-kiss-vdb/tree/main/sdk"
Repository = "https://github.com/Jairodaniel-17/rust-kiss-vdb"
"Bug Tracker" = "https://github.com/Jairodaniel-17/rust-kiss-vdb/issues"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false

[tool.setuptools.package-data]
"luma" = ["py.typed"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 100
