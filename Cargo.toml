[package]
name = "luma"
version = "4.20.1"
edition = "2021"
description = "Luma: High-performance Vector DB powered by RustKissVDB"
license = "MIT"
rust-version = "1.88"
default-run = "luma"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.7", features = ["macros"] }
futures-util = "0.3"
parking_lot = "0.12"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
    "fs",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hnsw_rs = "=0.3.1"
bincode = "1"
anndists = "=0.1.2"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.21"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rayon = "1.8"
sysinfo = "0.30"
crc32fast = "1.4"
time = { version = "0.3", features = ["formatting"] }
lru = "0.12"
rust-embed = "8.11.0"
mime_guess = "2.0.5"
tokio-util = { version = "0.7.18", features = ["rt"] }
uuid = { version = "1.20.0", features = ["v4", "fast-rng"] }
hex = "0.4.3"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
validator = { version = "0.19", features = ["derive"] }
async-trait = "0.1.89"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
pdf-extract = "0.12.0"
docx-rs = "0.4.19"
quick-xml = { version = "0.41", features = ["escape-html"] }
zip = { version = "8.1.0", features = ["default"] }
toml = "1.0.3"
dashmap = "6.1.0"
memmap2 = "0.9.10"
bytemuck = "1.25.0"
sqlparser = "0.55"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
tower_governor = { version = "0.4", features = ["axum"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
criterion = { version = "0.5", features = ["async_tokio"] }
tokio-test = "0.4"
mockall = "0.13"
assert_cmd = "2.0"

[[bench]]
name = "vector_bench"
harness = false

[[bench]]
name = "sqlite_bench"
harness = false

[features]
default = []
ivf_stress_tests = []

[[bench]]
name = "vector_mmap_bench"
harness = false

[[bench]]
name = "hybrid_hub_bench"
harness = false
