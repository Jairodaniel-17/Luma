# Scrape config for the demo stack.
#
# The scrape interval is short because this is a local dashboard someone is
# watching live; a production scrape of 30s or 60s is plenty.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: luma
    metrics_path: /v1/metrics
    static_configs:
      # Change this to wherever your instance runs. host.docker.internal reaches
      # the host from inside the container on Docker Desktop and, thanks to the
      # extra_hosts entry in the compose file, on Linux too.
      - targets: ["host.docker.internal:1234"]
