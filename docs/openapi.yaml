openapi: 3.0.3
info:
  title: Luma API
  version: 2.0.0
  description: 'API documentation for **Luma**, a convergent data engine for AI applications.


    ## Features

    - **Vector Operations**: Exact and ANN search (HNSW, IVF_FLAT_Q8, DiskANN).

    - **State Management**: Key-Value store with optimistic locking (CAS) and range scans.

    - **Document Store**: Raw document storage linked to vectors.

    - **LumaDatabase (Level 2)**: Auto-chunking, embedding generation, hybrid SQL+vector
    search.

    - **NS-Mem (Level 3)**: Agent memory layer — episodic, semantic, procedural and
    working memory with LLM-based fact consolidation.

    - **NS-Mem Graph Layer (v2.0.0)**: Typed edges between memories (supports, contradicts,
    supersedes, triggered_by, related_to), PageRank centrality, belief versioning, and
    Semantic Walk BFS recall replacing flat K-NN.

    - **Real-time**: SSE streaming of database events.

    '
servers:
- url: http://localhost:9917
  description: Default Local Server
tags:
- name: RAG Search
  description: High-level semantic search API (Text-to-Vector abstraction)
- name: Vector Operations
  description: Core vector database operations (Collections, Upsert, Search)
- name: State Management
  description: Distributed Key-Value store with CAS (Compare-And-Swap) support
- name: Streaming
  description: Real-time event subscription (SSE)
- name: Document Store
  description: Storage for raw documents and metadata
- name: SQL
  description: SQLite bridge for relational data
- name: System
  description: Health checks and metrics
- name: Meta
  description: Meta Engine integrated operations
- name: LumaDatabase
  description: High-level unified orchestrator (Nivel 2) for complex RAG flows, chunking,
    and multi-engine coordination.
- name: NS-Mem
  description: Memory layer for episodic, semantic, procedural and working-memory flows.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Enter your API Key (default is `dev`)
  schemas:
    ErrorBody:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          example: invalid_argument
        message:
          type: string
          example: The provided vector dimension does not match the collection.
    StateItem:
      type: object
      required:
      - key
      - value
      - revision
      properties:
        key:
          type: string
          example: config/retention
        value:
          type: object
          example:
            days: 30
        revision:
          type: integer
          format: uint64
          description: Monotonically increasing revision ID. Used for CAS.
          example: 105
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
    PutStateRequest:
      type: object
      required:
      - value
      properties:
        value:
          type: object
          example:
            days: 30
        ttl_ms:
          type: integer
          format: uint64
          nullable: true
          description: Time-to-live in milliseconds
        if_revision:
          type: integer
          format: uint64
          nullable: true
          description: 'Optimistic locking: only update if current revision matches
            this.'
    PutStateResponse:
      type: object
      required:
      - key
      - revision
      properties:
        key:
          type: string
        revision:
          type: integer
          format: uint64
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
    DeleteStateResponse:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
    StateBatchOperation:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
        value:
          type: object
        ttl_ms:
          type: integer
          format: uint64
          nullable: true
        if_revision:
          type: integer
          format: uint64
          nullable: true
    StateBatchResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        key:
          type: string
        revision:
          type: integer
          format: uint64
          nullable: true
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
        error:
          $ref: '#/components/schemas/ErrorBody'
          nullable: true
    StateBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/StateBatchResult'
    VectorMetric:
      type: string
      enum:
      - cosine
      - dot
      example: cosine
    CreateVectorCollectionRequest:
      type: object
      required:
      - dim
      - metric
      properties:
        dim:
          type: integer
          minimum: 1
          description: Dimension of the vectors in this collection
          example: 384
        metric:
          $ref: '#/components/schemas/VectorMetric'
    CreateVectorCollectionResponse:
      type: object
      required:
      - collection
      - dim
      - metric
      properties:
        collection:
          type: string
        dim:
          type: integer
        metric:
          $ref: '#/components/schemas/VectorMetric'
    VectorCollectionInfo:
      type: object
      required:
      - collection
      - dim
      - metric
      - live_count
      - total_records
      - upsert_count
      - file_len
      - applied_offset
      properties:
        collection:
          type: string
        dim:
          type: integer
        metric:
          $ref: '#/components/schemas/VectorMetric'
        live_count:
          type: integer
          format: uint64
        total_records:
          type: integer
          format: uint64
        upsert_count:
          type: integer
          format: uint64
        file_len:
          type: integer
          format: uint64
        applied_offset:
          type: integer
          format: uint64
        created_at_ms:
          type: integer
          format: uint64
          nullable: true
        updated_at_ms:
          type: integer
          format: uint64
          nullable: true
    VectorCollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/VectorCollectionInfo'
    VectorCollectionDetailResponse:
      type: object
      required:
      - collection
      properties:
        collection:
          type: string
        dim:
          type: integer
          nullable: true
        metric:
          $ref: '#/components/schemas/VectorMetric'
          nullable: true
        count:
          type: integer
          nullable: true
        created_at_ms:
          type: integer
          format: uint64
          nullable: true
        updated_at_ms:
          type: integer
          format: uint64
          nullable: true
        segments:
          type: integer
          nullable: true
        deleted:
          type: integer
          format: uint64
          nullable: true
        manifest:
          type: object
          nullable: true
        notes:
          type: string
          nullable: true
    VectorAddRequest:
      type: object
      required:
      - id
      - vector
      properties:
        id:
          type: string
          example: doc_v1_101
        vector:
          type: array
          items:
            type: number
            format: float
          description: Floating point vector data
          example:
          - 0.1
          - 0.23
          - -0.5
          - 0.8
        meta:
          type: object
          description: Arbitrary JSON metadata
          example:
            category: finance
            year: 2024
    VectorUpdateRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        vector:
          type: array
          items:
            type: number
            format: float
          nullable: true
        meta:
          nullable: true
    VectorDeleteRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    VectorDeleteResponse:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
    VectorGetResponse:
      type: object
      required:
      - id
      - vector
      - meta
      properties:
        id:
          type: string
        vector:
          type: array
          items:
            type: number
            format: float
        meta: {}
    VectorSearchRequest:
      type: object
      required:
      - vector
      - k
      properties:
        vector:
          type: array
          items:
            type: number
            format: float
          example:
          - 0.1
          - 0.23
          - -0.5
          - 0.8
        k:
          type: integer
          minimum: 1
          example: 5
        filters:
          nullable: true
          description: Exact match metadata filters
          example:
            category: finance
        include_meta:
          type: boolean
          nullable: true
          default: false
    VectorSearchHit:
      type: object
      required:
      - id
      - score
      properties:
        id:
          type: string
        score:
          type: number
          format: float
        meta:
          nullable: true
    VectorSearchResponse:
      type: object
      required:
      - hits
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/VectorSearchHit'
    VectorBatchItem:
      type: object
      required:
      - id
      - vector
      properties:
        id:
          type: string
        vector:
          type: array
          items:
            type: number
            format: float
        meta: {}
    VectorBatchResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - upserted
          - deleted
          - error
        id:
          type: string
        error:
          $ref: '#/components/schemas/ErrorBody'
          nullable: true
    VectorBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/VectorBatchResult'
    DocRecord:
      type: object
      required:
      - id
      - doc
      - revision
      properties:
        id:
          type: string
        doc:
          type: object
        revision:
          type: integer
          format: uint64
    DocFindResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocRecord'
    SqlQueryRequest:
      type: object
      required:
      - sql
      properties:
        sql:
          type: string
          example: SELECT * FROM users WHERE id = ?
        params:
          type: array
          items: {}
          example:
          - 123
    SqlQueryResponse:
      type: object
      properties:
        rows:
          type: array
          items: {}
    SqlExecResponse:
      type: object
      properties:
        rows_affected:
          type: integer
          format: uint64
    HighLevelSearchFilters:
      type: object
      properties:
        category:
          type: string
          example: netsuite
        language:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          example:
          - en
          - es
        status:
          type: string
          example: active
        version_policy:
          type: string
          enum:
          - latest
          - all
          description: Strategy for handling document versions
          default: latest
    HighLevelSearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          description: Natural language query text
          example: oracle approval workflow
        top_k:
          type: integer
          default: 10
          example: 10
        filters:
          $ref: '#/components/schemas/HighLevelSearchFilters'
        group_by:
          type: string
          description: Field to group results by (e.g. 'document_id')
          example: document_id
        group_limit:
          type: integer
          default: 1
          description: Max results per group
    HighLevelDocumentMetadata:
      type: object
      properties:
        filename:
          type: string
        processed_at:
          type: integer
          format: uint64
        category:
          type: string
        language:
          type: string
        status:
          type: string
        version:
          type: string
        group_id:
          type: integer
        document_id:
          type: string
    HighLevelDocumentResponse:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        metadata:
          $ref: '#/components/schemas/HighLevelDocumentMetadata'
    HighLevelSearchResult:
      type: object
      properties:
        score:
          type: number
          format: float
        document:
          $ref: '#/components/schemas/HighLevelDocumentResponse'
    HighLevelSearchResponse:
      type: object
      properties:
        query:
          type: string
        top_k:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/HighLevelSearchResult'
    MemoryKind:
      type: string
      enum:
      - episodic
      - semantic
      - procedural
      - working
    MemoryStatus:
      type: string
      enum:
      - draft
      - active
      - archived
    MemoryQueryMode:
      type: string
      enum:
      - auto
      - recall
      - timeline
      - next_step
      - constraint_check
    RuleCondition:
      type: object
      required:
      - field
      - op
      - value
      properties:
        field:
          type: string
          example: actor.role
        op:
          type: string
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
          - contains
          - in
        value: {}
    MemoryRecord:
      type: object
      required:
      - id
      - namespace
      - kind
      - status
      - content
      - confidence
      - source
      - created_at_ms
      - updated_at_ms
      properties:
        id:
          type: string
        namespace:
          type: string
        entity_id:
          type: string
          nullable: true
        kind:
          $ref: '#/components/schemas/MemoryKind'
        status:
          $ref: '#/components/schemas/MemoryStatus'
        content:
          type: string
        metadata:
          type: object
          nullable: true
        confidence:
          type: number
          format: float
        source:
          type: string
        created_at_ms:
          type: integer
          format: uint64
        updated_at_ms:
          type: integer
          format: uint64
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
        embedding_ref:
          type: string
          nullable: true
    MemoryEvidence:
      type: object
      required:
      - memory_id
      - kind
      - score
      - source
      - snippet
      properties:
        memory_id:
          type: string
        kind:
          $ref: '#/components/schemas/MemoryKind'
        score:
          type: number
          format: float
        source:
          type: string
        snippet:
          type: string
    MemoryResult:
      type: object
      required:
      - record
      properties:
        record:
          $ref: '#/components/schemas/MemoryRecord'
        score:
          type: number
          format: float
          nullable: true
    ProcedureNode:
      type: object
      required:
      - node_id
      - kind
      - label
      properties:
        node_id:
          type: string
        kind:
          type: string
          enum:
          - start
          - action
          - decision
          - goal
        label:
          type: string
        payload:
          type: object
          nullable: true
    ProcedureEdge:
      type: object
      required:
      - from_node_id
      - to_node_id
      properties:
        from_node_id:
          type: string
        to_node_id:
          type: string
        priority:
          type: integer
          default: 0
        condition:
          allOf:
          - $ref: '#/components/schemas/RuleCondition'
          nullable: true
    ProcedureConstraint:
      type: object
      required:
      - constraint_id
      - condition
      properties:
        constraint_id:
          type: string
        target_node_id:
          type: string
          nullable: true
        condition:
          $ref: '#/components/schemas/RuleCondition'
        message:
          type: string
          nullable: true
    IngestEventRequest:
      type: object
      required:
      - text
      properties:
        id:
          type: string
          nullable: true
        entity_id:
          type: string
          nullable: true
        text:
          type: string
        metadata:
          type: object
          nullable: true
        source:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
    UpsertFactRequest:
      type: object
      required:
      - content
      properties:
        id:
          type: string
          nullable: true
        entity_id:
          type: string
          nullable: true
        fact_key:
          type: string
          nullable: true
        content:
          type: string
        metadata:
          type: object
          nullable: true
        source:
          type: string
          nullable: true
        confidence:
          type: number
          format: float
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/MemoryStatus'
          nullable: true
    UpsertProcedureRequest:
      type: object
      required:
      - procedure_id
      - name
      - nodes
      - edges
      properties:
        procedure_id:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum:
          - draft
          - active
          - archived
          nullable: true
        description:
          type: string
          nullable: true
        confidence:
          type: number
          format: float
          nullable: true
        source:
          type: string
          nullable: true
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureEdge'
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureConstraint'
    MemoryQueryRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        entity_id:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        procedure_id:
          type: string
          nullable: true
        current_node_id:
          type: string
          nullable: true
        context:
          type: object
          nullable: true
        mode:
          allOf:
          - $ref: '#/components/schemas/MemoryQueryMode'
          nullable: true
        limit:
          type: integer
          nullable: true
        include_evidence:
          type: boolean
          nullable: true
        include_plan:
          type: boolean
          nullable: true
        include_diagnostics:
          type: boolean
          nullable: true
    NextStepRequest:
      type: object
      required:
      - procedure_id
      properties:
        procedure_id:
          type: string
        current_node_id:
          type: string
          nullable: true
        context:
          type: object
          nullable: true
    NextStepResponse:
      type: object
      required:
      - procedure_id
      properties:
        procedure_id:
          type: string
        current_node_id:
          type: string
          nullable: true
        next_node:
          allOf:
          - $ref: '#/components/schemas/ProcedureNode'
          nullable: true
        edge:
          allOf:
          - $ref: '#/components/schemas/ProcedureEdge'
          nullable: true
        blocked_reason:
          type: string
          nullable: true
    MemoryQueryResponse:
      type: object
      required:
      - mode
      - results
      properties:
        mode:
          $ref: '#/components/schemas/MemoryQueryMode'
        results:
          type: array
          items:
            $ref: '#/components/schemas/MemoryResult'
        evidence:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MemoryEvidence'
        next_step:
          allOf:
          - $ref: '#/components/schemas/NextStepResponse'
          nullable: true
        plan:
          type: object
          nullable: true
        diagnostics:
          type: object
          nullable: true
    TimelineResponse:
      type: object
      required:
      - entity_id
      - events
      properties:
        entity_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/MemoryRecord'
    EdgeType:
      type: string
      enum:
      - supports
      - contradicts
      - supersedes
      - triggered_by
      - related_to
      description: Semantic relationship type between two memory records.
    MemoryEdge:
      type: object
      required:
      - id
      - namespace
      - source_id
      - target_id
      - edge_type
      - weight
      - created_at_ms
      properties:
        id:
          type: string
        namespace:
          type: string
        source_id:
          type: string
        target_id:
          type: string
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        weight:
          type: number
          format: float
          description: Edge weight in [0, 1]. Used to scale the score contribution during Semantic Walk BFS.
        metadata:
          type: object
          nullable: true
        created_at_ms:
          type: integer
          format: uint64
    BeliefVersion:
      type: object
      required:
      - id
      - fact_key
      - namespace
      - content
      - confidence
      - status
      - valid_from
      - created_at_ms
      properties:
        id:
          type: string
        fact_key:
          type: string
        namespace:
          type: string
        entity_id:
          type: string
          nullable: true
        content:
          type: string
        confidence:
          type: number
          format: float
        status:
          type: string
        superseded_by:
          type: string
          nullable: true
          description: ID of the newer MemoryRecord that replaced this version.
        valid_from:
          type: integer
          format: uint64
        valid_until:
          type: integer
          format: uint64
          nullable: true
        created_at_ms:
          type: integer
          format: uint64
    UpsertEdgeRequest:
      type: object
      required:
      - source_id
      - target_id
      - edge_type
      properties:
        id:
          type: string
          nullable: true
          description: Optional idempotent edge ID. Auto-generated UUID if omitted.
        source_id:
          type: string
        target_id:
          type: string
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        weight:
          type: number
          format: float
          nullable: true
          default: 1.0
        metadata:
          type: object
          nullable: true
    NodeEdgesResponse:
      type: object
      required:
      - memory_id
      - outgoing
      - incoming
      properties:
        memory_id:
          type: string
        outgoing:
          type: array
          items:
            $ref: '#/components/schemas/MemoryEdge'
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/MemoryEdge'
    BeliefHistoryResponse:
      type: object
      required:
      - fact_key
      - versions
      properties:
        fact_key:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/BeliefVersion'
          description: Ordered from newest to oldest. The active version is first.
    CentralityResponse:
      type: object
      required:
      - namespace
      - updated
      properties:
        namespace:
          type: string
        updated:
          type: integer
          description: Number of memory records whose centrality_score was recomputed.
paths:
  /v1/health:
    get:
      tags:
      - System
      summary: Health check
      responses:
        '200':
          description: Server is healthy
  /v1/metrics:
    get:
      tags:
      - System
      summary: Prometheus-compatible metrics
      responses:
        '200':
          description: Metrics in text format
  /v1/stream:
    get:
      tags:
      - Streaming
      security:
      - bearerAuth: []
      summary: Real-time Event Stream (SSE)
      description: 'Subscribe to database events (upserts, state changes) via Server-Sent
        Events.

        Supports filtering by type, key prefix, and collection.

        '
      parameters:
      - in: query
        name: since
        description: Offset/event_id to replay from. Default 0.
        schema:
          type: integer
          format: uint64
          default: 0
      - in: query
        name: types
        description: Comma-separated event types (e.g., `vector_upserted,state_changed`).
        schema:
          type: string
      - in: query
        name: key_prefix
        description: Filter events by key prefix.
        schema:
          type: string
      - in: query
        name: collection
        description: Filter events by collection name.
        schema:
          type: string
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Stream of events
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized
  /v1/events:
    get:
      tags:
      - Streaming
      security:
      - bearerAuth: []
      deprecated: true
      summary: Legacy SSE alias (Deprecated)
      description: '**DEPRECATED**: Use `/v1/stream` instead.


        Legacy alias where `prefix` maps to `key_prefix`. Does not support `collection`
        filter.

        '
      parameters:
      - in: query
        name: since
        schema:
