  /v1/db/{namespace}/ingest:
    post:
      tags:
      - LumaDatabase
      security:
      - bearerAuth: []
      summary: Ingest a document using the Unified Hub
      description: Automatically extracts text, chunks it, calls an Embedding provider,
        and saves the vectors, the raw document, and relational metadata synchronously
        with transactional safety.
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  description: The full document text to process and chunk.
                id:
                  type: string
                  description: Optional custom ID for the document. Auto-generated
                    if omitted.
                metadata:
                  type: object
                  description: Metadata attributes to save in SQLite for relational
                    filtering.
      responses:
        '200':
          description: Ingested successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  doc_id:
                    type: string
                  namespace:
                    type: string
        '400':
          description: Bad Request (e.g. dimension mismatch)
        '500':
          description: Internal Server Error (e.g. io_failure_during_transaction)
  /v1/db/{namespace}/search:
    post:
      tags:
      - LumaDatabase
      security:
      - bearerAuth: []
      summary: Hybrid RAG Search
      description: Performs a semantic search with SQL pre-filtering. Automatically
        groups vector chunks and hydrates the full document.
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  description: The semantic question or search terms.
                sql_filter:
                  type: string
                  description: Optional. A valid SQL WHERE clause to pre-filter documents
                    (e.g., "JSON_EXTRACT(metadata, '$.year') = 2024").
                limit:
                  type: integer
                  default: 10
      responses:
        '200':
          description: Search results with grouped snippets
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        score:
                          type: number
                          format: float
                        snippets:
                          type: array
                          items:
                            type: string
                        document:
                          type: object
        '500':
          description: Internal Server Error
