  /v1/memory/{namespace}/graph/centrality:
    post:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Recompute PageRank centrality for the namespace
      description: 'Runs 15 iterations of PageRank (damping 0.85) over positive edges
        (supports, triggered_by, related_to) and writes normalized [0,1] scores back
        to `memory_records.centrality_score`. Scores are used during Semantic Walk BFS
        to boost highly-connected nodes.

        This operation is idempotent and safe to call at any time.'
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Centrality scores recomputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CentralityResponse'
        '500':
          description: Centrality computation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
