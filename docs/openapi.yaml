openapi: 3.0.3
info:
  title: Luma API
  version: 3.0.0
  description: 'API documentation for **Luma**, a convergent data engine for AI applications.


    ## Features

    - **Vector Operations**: Exact and ANN search (HNSW, IVF_FLAT_Q8, DiskANN). Includes
    batch search (up to 100 parallel queries), cursor-based scroll/export, cosine reranking,
    and group-by aggregations.

    - **State Management**: Key-Value store with optimistic locking (CAS) and range scans.

    - **Document Store**: Raw document storage linked to vectors.

    - **LumaDatabase (Level 2)**: Auto-chunking, embedding generation, hybrid SQL+vector
    search.

    - **NS-Mem (Level 3)**: Agent memory layer — episodic, semantic, procedural and
    working memory with LLM-based fact consolidation. v3.0.0 adds semantic deduplication
    (cosine ≥ 0.95), exponential decay scoring, and automatic contradiction detection
    (cosine < 0.55 → Contradicts edge).

    - **NS-Mem Graph Layer (v2.0.0)**: Typed edges between memories (supports, contradicts,
    supersedes, triggered_by, related_to), PageRank centrality, belief versioning, and
    Semantic Walk BFS recall replacing flat K-NN.

    - **Embedding Providers**: OpenAI, Azure OpenAI, Cohere, HuggingFace Inference API,
    Ollama, Mock. All providers support exponential-backoff retry with jitter.

    - **Observability**: Audit log middleware (every authenticated request logged to SQLite),
    query via `GET /v1/admin/audit`. Force snapshots via `POST /v1/admin/backup`.

    - **Access Control**: RBAC API key management — admin and user roles. Keys created,
    listed and revoked via `/v1/auth/keys`.

    - **Real-time**: SSE streaming of database events.

    '
servers:
- url: http://localhost:9917
  description: Default Local Server
tags:
- name: RAG Search
  description: High-level semantic search API (Text-to-Vector abstraction)
- name: Vector Operations
  description: Core vector database operations (Collections, Upsert, Search)
- name: State Management
  description: Distributed Key-Value store with CAS (Compare-And-Swap) support
- name: Streaming
  description: Real-time event subscription (SSE)
- name: Document Store
  description: Storage for raw documents and metadata
- name: System
  description: Health checks and metrics
- name: Meta
  description: Meta Engine integrated operations
- name: LumaDatabase
  description: High-level unified orchestrator (Nivel 2) for complex RAG flows, chunking,
    and multi-engine coordination.
- name: NS-Mem
  description: Memory layer for episodic, semantic, procedural and working-memory flows.
- name: Admin
  description: Backup, audit log and operational endpoints. Require admin role.
- name: Access Control
  description: API key management — create, list and revoke keys. Require admin role.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Enter your API Key (default is `dev`)
  schemas:
    SearchIngestDocument:
      type: object
      required:
      - id
      - vector
      - content
      properties:
        id:
          type: integer
          format: int32
        vector:
          type: array
          items:
            type: number
            format: float
        content:
          type: string
        metadata:
          $ref: '#/components/schemas/SearchDocumentMetadata'
    SearchDocumentMetadata:
      type: object
      description: All fields optional; omitted fields are not serialized back.
      properties:
        filename:
          type: string
        processed_at:
          type: integer
          format: int64
        category:
          type: string
        language:
          type: string
        status:
          type: string
        version:
          type: string
        group_id:
          type: integer
          format: int32
    SearchIngestRequest:
      type: object
      required:
      - document
      properties:
        document:
          $ref: '#/components/schemas/SearchIngestDocument'
    BlobPutResponse:
      type: object
      required:
      - bucket
      - key
      - size
      - etag
      properties:
        bucket:
          type: string
        key:
          type: string
        size:
          type: integer
          format: int64
          description: Stored object size in bytes.
        etag:
          type: string
    BlobDeleteResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    BlobListResponse:
      type: object
      required:
      - keys
      - count
      properties:
        keys:
          type: array
          items:
            type: string
        count:
          type: integer
    EnqueueRequest:
      type: object
      required:
      - body
      properties:
        body:
          description: Arbitrary JSON payload, returned verbatim on receive.
        delay_secs:
          type: integer
          format: int64
          nullable: true
          description: Delay before the message becomes visible.
    EnqueueResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    ReceiveRequest:
      type: object
      properties:
        max:
          type: integer
          nullable: true
          description: Maximum messages to lease in this call.
        visibility_secs:
          type: integer
          format: int64
          nullable: true
          description: How long the lease lasts before the message is redelivered.
    ReceivedMessage:
      type: object
      required:
      - id
      - body
      - attempts
      properties:
        id:
          type: string
        body:
          description: The payload as enqueued.
        attempts:
          type: integer
          format: int64
          description: Delivery attempts so far, including this one.
    ReceiveResponse:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ReceivedMessage'
    QueueAckResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    QueueStatsResponse:
      type: object
      required:
      - queue
      - depth
      - visible
      properties:
        queue:
          type: string
        depth:
          type: integer
          description: Total messages held, leased ones included.
        visible:
          type: integer
          description: Messages currently available to receive.
    RegisterRequest:
      type: object
      required:
      - org_name
      - email
      - password
      properties:
        org_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    RegisterResponse:
      type: object
      required:
      - org_id
      - user_id
      - email
      - role
      properties:
        org_id:
          type: string
        user_id:
          type: string
        email:
          type: string
        role:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    SessionResponse:
      type: object
      required:
      - token
      - expires_at_ms
      - role
      properties:
        token:
          type: string
          description: Opaque session token, prefixed `lums_`. Only its SHA-256 hash is stored.
        expires_at_ms:
          type: integer
          format: int64
        role:
          type: string
        org_id:
          type: string
          nullable: true
        user_id:
          type: string
    RefreshResponse:
      type: object
      required:
      - token
      - expires_at_ms
      properties:
        token:
          type: string
        expires_at_ms:
          type: integer
          format: int64
    Session:
      type: object
      description: Session metadata. The token itself is never returned.
      properties:
        created_at_ms:
          type: integer
          format: int64
        expires_at_ms:
          type: integer
          format: int64
        org_id:
          type: string
          nullable: true
        current:
          type: boolean
          description: Whether this is the session making the request.
    SessionListResponse:
      type: object
      required:
      - sessions
      - count
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        count:
          type: integer
    RevokeAllResponse:
      type: object
      required:
      - revoked
      properties:
        revoked:
          type: integer
          description: Sessions revoked, excluding the current one.
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          description: The caller's role in this org, when listing memberships.
        created_at_ms:
          type: integer
          format: int64
    OrgListResponse:
      type: object
      required:
      - orgs
      properties:
        orgs:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
    CreateOrgRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    SwitchOrgRequest:
      type: object
      required:
      - org_id
      properties:
        org_id:
          type: string
    SwitchOrgResponse:
      type: object
      required:
      - token
      - expires_at_ms
      - org_id
      - role
      properties:
        token:
          type: string
        expires_at_ms:
          type: integer
          format: int64
        org_id:
          type: string
        role:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
        org_id:
          type: string
          nullable: true
    UserListResponse:
      type: object
      required:
      - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    CreateUserRequest:
      type: object
      required:
      - email
      - password
      - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
        org_id:
          type: string
          nullable: true
          description: Honored only for platform admins.
    UpdateRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          type: string
    Member:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          type: string
    MemberListResponse:
      type: object
      required:
      - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    AddMemberRequest:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
    InviteRequest:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
        password:
          type: string
          format: password
          nullable: true
          description: Omit to have a temporary password generated and returned once.
    InviteResponse:
      type: object
      required:
      - user_id
      - email
      - org_id
      - role
      - created
      properties:
        user_id:
          type: string
        email:
          type: string
        org_id:
          type: string
        role:
          type: string
        created:
          type: boolean
          description: True when the account did not exist and was created.
        temp_password:
          type: string
          nullable: true
          description: Present only when a password was generated. Returned once, never retrievable again.
    AccessPolicy:
      type: object
      description: Allow-list governing who may self-register.
      properties:
        domains:
          type: array
          items:
            type: string
        emails:
          type: array
          items:
            type: string
    DomainOrgMapping:
      type: object
      properties:
        domain:
          type: string
        org_id:
          type: string
        role:
          type: string
    DomainOrgListResponse:
      type: object
      required:
      - mappings
      properties:
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/DomainOrgMapping'
    DomainOrgRequest:
      type: object
      required:
      - domain
      - org_id
      properties:
        domain:
          type: string
        org_id:
          type: string
        role:
          type: string
          nullable: true
          description: Defaults to `member`.
    UpdateKeyRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          type: string
        permissions:
          nullable: true
          description: Optional explicit permission payload attached to the key.
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parent_role_id:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    RoleListResponse:
      type: object
      required:
      - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    CreateRoleRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        parent_role_id:
          type: string
          nullable: true
          description: Inherit this parent's permissions.
        description:
          type: string
          nullable: true
    Permission:
      type: object
      required:
      - resource
      - action
      properties:
        resource:
          type: string
        action:
          type: string
    PermissionListResponse:
      type: object
      required:
      - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    PermissionCheckResponse:
      type: object
      required:
      - role
      - resource
      - action
      - allowed
      properties:
        role:
          type: string
        resource:
          type: string
        action:
          type: string
        allowed:
          type: boolean
    AuditEvent:
      type: object
      description: Business-level event from sys_audit_events.
      properties:
        ts:
          type: integer
          format: int64
        org_id:
          type: string
          nullable: true
        user_id:
          type: string
          nullable: true
        action:
          type: string
        target:
          type: string
          nullable: true
        detail:
          nullable: true
    AuditEventListResponse:
      type: object
      required:
      - events
      - count
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        count:
          type: integer
    EmbeddingProbeRequest:
      type: object
      required:
      - provider
      properties:
        provider:
          type: string
          description: 'One of ollama, openai, azure, cohere, huggingface, or an
            OpenAI-wire-compatible alias (google, gemini, custom,
            openai_compatible).'
        url:
          type: string
        api_key:
          type: string
          format: password
        model:
          type: string
        azure_api_base:
          type: string
        azure_deployment:
          type: string
        azure_api_version:
          type: string
    EmbeddingProbeResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
        dim:
          type: integer
          description: Dimension actually returned by the provider. Present when ok is true.
        provider:
          type: string
        model:
          type: string
        error:
          type: string
          description: The provider's own error message. Present when ok is false.
    ReindexRequest:
      type: object
      properties:
        target:
          type: string
          description: 'Collection to write into. Defaults to `{source}__reindex`.
            Must differ from the source.'
        batch_size:
          type: integer
          default: 64
          description: Texts per embedding call. Clamped server-side to 1..512.
    ReindexStartResponse:
      type: object
      required:
      - job_id
      - source
      - target
      - progress_key
      properties:
        job_id:
          type: string
        source:
          type: string
        target:
          type: string
        progress_key:
          type: string
          description: KV key the job publishes progress to.
    ReindexProgress:
      type: object
      required:
      - job_id
      - source
      - target
      - status
      - processed
      - reembedded
      - skipped_no_text
      properties:
        job_id:
          type: string
        source:
          type: string
        target:
          type: string
        status:
          type: string
          enum:
          - running
          - done
          - failed
        processed:
          type: integer
          description: Vectors examined so far.
        reembedded:
          type: integer
          description: Vectors written to the target.
        skipped_no_text:
          type: integer
          description: Vectors left behind for lack of chunk text to re-embed.
        target_dim:
          type: integer
          nullable: true
          description: 'Dimension the provider actually returned, measured on the
            first batch rather than taken from config.'
        error:
          type: string
          nullable: true
        started_at_ms:
          type: integer
          format: int64
        updated_at_ms:
          type: integer
          format: int64
    ErrorBody:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          example: invalid_argument
        message:
          type: string
          example: The provided vector dimension does not match the collection.
    StateItem:
      type: object
      required:
      - key
      - value
      - revision
      properties:
        key:
          type: string
          example: config/retention
        value:
          type: object
          example:
            days: 30
        revision:
          type: integer
          format: uint64
          description: Monotonically increasing revision ID. Used for CAS.
          example: 105
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
    PutStateRequest:
      type: object
      required:
      - value
      properties:
        value:
          type: object
          example:
            days: 30
        ttl_ms:
          type: integer
          format: uint64
          nullable: true
          description: Time-to-live in milliseconds
        if_revision:
          type: integer
          format: uint64
          nullable: true
          description: 'Optimistic locking: only update if current revision matches
            this.'
    PutStateResponse:
      type: object
      required:
      - key
      - revision
      properties:
        key:
          type: string
        revision:
          type: integer
          format: uint64
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
    DeleteStateResponse:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
    StateBatchOperation:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
        value:
          type: object
        ttl_ms:
          type: integer
          format: uint64
          nullable: true
        if_revision:
          type: integer
          format: uint64
          nullable: true
    StateBatchResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        key:
          type: string
        revision:
          type: integer
          format: uint64
          nullable: true
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
        error:
          $ref: '#/components/schemas/ErrorBody'
          nullable: true
    StateBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/StateBatchResult'
    VectorMetric:
      type: string
      enum:
      - cosine
      - dot
      example: cosine
    CreateVectorCollectionRequest:
      type: object
      required:
      - dim
      - metric
      properties:
        dim:
          type: integer
          minimum: 1
          description: Dimension of the vectors in this collection
          example: 384
        metric:
          $ref: '#/components/schemas/VectorMetric'
    CreateVectorCollectionResponse:
      type: object
      required:
      - collection
      - dim
      - metric
      properties:
        collection:
          type: string
        dim:
          type: integer
        metric:
          $ref: '#/components/schemas/VectorMetric'
    VectorCollectionInfo:
      type: object
      required:
      - collection
      - dim
      - metric
      - live_count
      - total_records
      - upsert_count
      - file_len
      - applied_offset
      properties:
        collection:
          type: string
        dim:
          type: integer
        metric:
          $ref: '#/components/schemas/VectorMetric'
        live_count:
          type: integer
          format: uint64
        total_records:
          type: integer
          format: uint64
        upsert_count:
          type: integer
          format: uint64
        file_len:
          type: integer
          format: uint64
        applied_offset:
          type: integer
          format: uint64
        created_at_ms:
          type: integer
          format: uint64
          nullable: true
        updated_at_ms:
          type: integer
          format: uint64
          nullable: true
    VectorCollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/VectorCollectionInfo'
    VectorCollectionDetailResponse:
      type: object
      required:
      - collection
      properties:
        collection:
          type: string
        dim:
          type: integer
          nullable: true
        metric:
          $ref: '#/components/schemas/VectorMetric'
          nullable: true
        count:
          type: integer
          nullable: true
        created_at_ms:
          type: integer
          format: uint64
          nullable: true
        updated_at_ms:
          type: integer
          format: uint64
          nullable: true
        segments:
          type: integer
          nullable: true
        deleted:
          type: integer
          format: uint64
          nullable: true
        manifest:
          type: object
          nullable: true
        notes:
          type: string
          nullable: true
    VectorAddRequest:
      type: object
      required:
      - id
      - vector
      properties:
        id:
          type: string
          example: doc_v1_101
        vector:
          type: array
          items:
            type: number
            format: float
          description: Floating point vector data
          example:
          - 0.1
          - 0.23
          - -0.5
          - 0.8
        meta:
          type: object
          description: Arbitrary JSON metadata
          example:
            category: finance
            year: 2024
    VectorUpdateRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        vector:
          type: array
          items:
            type: number
            format: float
          nullable: true
        meta:
          nullable: true
    VectorDeleteRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    VectorDeleteResponse:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
    VectorGetResponse:
      type: object
      required:
      - id
      - vector
      - meta
      properties:
        id:
          type: string
        vector:
          type: array
          items:
            type: number
            format: float
        meta: {}
    VectorSearchRequest:
      type: object
      required:
      - vector
      - k
      properties:
        vector:
          type: array
          items:
            type: number
            format: float
          example:
          - 0.1
          - 0.23
          - -0.5
          - 0.8
        k:
          type: integer
          minimum: 1
          example: 5
        filters:
          nullable: true
          description: Exact match metadata filters
          example:
            category: finance
        include_meta:
          type: boolean
          nullable: true
          default: false
    VectorSearchHit:
      type: object
      required:
      - id
      - score
      properties:
        id:
          type: string
        score:
          type: number
          format: float
        meta:
          nullable: true
    VectorSearchResponse:
      type: object
      required:
      - hits
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/VectorSearchHit'
    VectorBatchItem:
      type: object
      required:
      - id
      - vector
      properties:
        id:
          type: string
        vector:
          type: array
          items:
            type: number
            format: float
        meta: {}
    VectorBatchResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - upserted
          - deleted
          - error
        id:
          type: string
        error:
          $ref: '#/components/schemas/ErrorBody'
          nullable: true
    VectorBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/VectorBatchResult'
    DocRecord:
      type: object
      required:
      - id
      - doc
      - revision
      properties:
        id:
          type: string
        doc:
          type: object
        revision:
          type: integer
          format: uint64
    DocFindResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocRecord'
    HighLevelSearchFilters:
      type: object
      properties:
        category:
          type: string
          example: netsuite
        language:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          example:
          - en
          - es
        status:
          type: string
          example: active
        version_policy:
          type: string
          enum:
          - latest
          - all
          description: Strategy for handling document versions
          default: latest
    HighLevelSearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          description: Natural language query text
          example: oracle approval workflow
        top_k:
          type: integer
          default: 10
          example: 10
        filters:
          $ref: '#/components/schemas/HighLevelSearchFilters'
        group_by:
          type: string
          description: Field to group results by (e.g. 'document_id')
          example: document_id
        group_limit:
          type: integer
          default: 1
          description: Max results per group
    HighLevelDocumentMetadata:
      type: object
      properties:
        filename:
          type: string
        processed_at:
          type: integer
          format: uint64
        category:
          type: string
        language:
          type: string
        status:
          type: string
        version:
          type: string
        group_id:
          type: integer
        document_id:
          type: string
    HighLevelDocumentResponse:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        metadata:
          $ref: '#/components/schemas/HighLevelDocumentMetadata'
    HighLevelSearchResult:
      type: object
      properties:
        score:
          type: number
          format: float
        document:
          $ref: '#/components/schemas/HighLevelDocumentResponse'
    HighLevelSearchResponse:
      type: object
      properties:
        query:
          type: string
        top_k:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/HighLevelSearchResult'
    MemoryKind:
      type: string
      enum:
      - episodic
      - semantic
      - procedural
      - working
    MemoryStatus:
      type: string
      enum:
      - draft
      - active
      - archived
    MemoryQueryMode:
      type: string
      enum:
      - auto
      - recall
      - timeline
      - next_step
      - constraint_check
    RuleCondition:
      type: object
      required:
      - field
      - op
      - value
      properties:
        field:
          type: string
          example: actor.role
        op:
          type: string
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
          - contains
          - in
        value: {}
    MemoryRecord:
      type: object
      required:
      - id
      - namespace
      - kind
      - status
      - content
      - confidence
      - source
      - created_at_ms
      - updated_at_ms
      properties:
        id:
          type: string
        namespace:
          type: string
        entity_id:
          type: string
          nullable: true
        kind:
          $ref: '#/components/schemas/MemoryKind'
        status:
          $ref: '#/components/schemas/MemoryStatus'
        content:
          type: string
        metadata:
          type: object
          nullable: true
        confidence:
          type: number
          format: float
        source:
          type: string
        created_at_ms:
          type: integer
          format: uint64
        updated_at_ms:
          type: integer
          format: uint64
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
        embedding_ref:
          type: string
          nullable: true
        decay_score:
          type: number
          format: float
          default: 1.0
          description: >
            Exponential decay score in [0, 1]. Decreases over time according to
            `exp(-ln(2)/half_life_days * elapsed_days)`. Facts below
            `memory_decay_archive_threshold` are archived automatically by the
            background decay task (opt-in via `memory_decay_enabled`).
    MemoryEvidence:
      type: object
      required:
      - memory_id
      - kind
      - score
      - source
      - snippet
      properties:
        memory_id:
          type: string
        kind:
          $ref: '#/components/schemas/MemoryKind'
        score:
          type: number
          format: float
        source:
          type: string
        snippet:
          type: string
    MemoryResult:
      type: object
      required:
      - record
      properties:
        record:
          $ref: '#/components/schemas/MemoryRecord'
        score:
          type: number
          format: float
          nullable: true
    ProcedureNode:
      type: object
      required:
      - node_id
      - kind
      - label
      properties:
        node_id:
          type: string
        kind:
          type: string
          enum:
          - start
          - action
          - decision
          - goal
        label:
          type: string
        payload:
          type: object
          nullable: true
    ProcedureEdge:
      type: object
      required:
      - from_node_id
      - to_node_id
      properties:
        from_node_id:
          type: string
        to_node_id:
          type: string
        priority:
          type: integer
          default: 0
        condition:
          allOf:
          - $ref: '#/components/schemas/RuleCondition'
          nullable: true
    ProcedureConstraint:
      type: object
      required:
      - constraint_id
      - condition
      properties:
        constraint_id:
          type: string
        target_node_id:
          type: string
          nullable: true
        condition:
          $ref: '#/components/schemas/RuleCondition'
        message:
          type: string
          nullable: true
    IngestEventRequest:
      type: object
      required:
      - text
      properties:
        id:
          type: string
          nullable: true
        entity_id:
          type: string
          nullable: true
        text:
          type: string
        metadata:
          type: object
          nullable: true
        source:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        expires_at_ms:
          type: integer
          format: uint64
          nullable: true
    UpsertFactRequest:
      type: object
      required:
      - content
      properties:
        id:
          type: string
          nullable: true
        entity_id:
          type: string
          nullable: true
        fact_key:
          type: string
          nullable: true
        content:
          type: string
        metadata:
          type: object
          nullable: true
        source:
          type: string
          nullable: true
        confidence:
          type: number
          format: float
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/MemoryStatus'
          nullable: true
    UpsertProcedureRequest:
      type: object
      required:
      - procedure_id
      - name
      - nodes
      - edges
      properties:
        procedure_id:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum:
          - draft
          - active
          - archived
          nullable: true
        description:
          type: string
          nullable: true
        confidence:
          type: number
          format: float
          nullable: true
        source:
          type: string
          nullable: true
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureEdge'
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureConstraint'
    MemoryQueryRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        entity_id:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        procedure_id:
          type: string
          nullable: true
        current_node_id:
          type: string
          nullable: true
        context:
          type: object
          nullable: true
        mode:
          allOf:
          - $ref: '#/components/schemas/MemoryQueryMode'
          nullable: true
        limit:
          type: integer
          nullable: true
        include_evidence:
          type: boolean
          nullable: true
        include_plan:
          type: boolean
          nullable: true
        include_diagnostics:
          type: boolean
          nullable: true
    NextStepRequest:
      type: object
      required:
      - procedure_id
      properties:
        procedure_id:
          type: string
        current_node_id:
          type: string
          nullable: true
        context:
          type: object
          nullable: true
    NextStepResponse:
      type: object
      required:
      - procedure_id
      properties:
        procedure_id:
          type: string
        current_node_id:
          type: string
          nullable: true
        next_node:
          allOf:
          - $ref: '#/components/schemas/ProcedureNode'
          nullable: true
        edge:
          allOf:
          - $ref: '#/components/schemas/ProcedureEdge'
          nullable: true
        blocked_reason:
          type: string
          nullable: true
    MemoryQueryResponse:
      type: object
      required:
      - mode
      - results
      properties:
        mode:
          $ref: '#/components/schemas/MemoryQueryMode'
        results:
          type: array
          items:
            $ref: '#/components/schemas/MemoryResult'
        evidence:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MemoryEvidence'
        next_step:
          allOf:
          - $ref: '#/components/schemas/NextStepResponse'
          nullable: true
        plan:
          type: object
          nullable: true
        diagnostics:
          type: object
          nullable: true
    TimelineResponse:
      type: object
      required:
      - entity_id
      - events
      properties:
        entity_id:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/MemoryRecord'
    EdgeType:
      type: string
      enum:
      - supports
      - contradicts
      - supersedes
      - triggered_by
      - related_to
      description: Semantic relationship type between two memory records.
    MemoryEdge:
      type: object
      required:
      - id
      - namespace
      - source_id
      - target_id
      - edge_type
      - weight
      - created_at_ms
      properties:
        id:
          type: string
        namespace:
          type: string
        source_id:
          type: string
        target_id:
          type: string
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        weight:
          type: number
          format: float
          description: Edge weight in [0, 1]. Used to scale the score contribution during Semantic Walk BFS.
        metadata:
          type: object
          nullable: true
        created_at_ms:
          type: integer
          format: uint64
    BeliefVersion:
      type: object
      required:
      - id
      - fact_key
      - namespace
      - content
      - confidence
      - status
      - valid_from
      - created_at_ms
      properties:
        id:
          type: string
        fact_key:
          type: string
        namespace:
          type: string
        entity_id:
          type: string
          nullable: true
        content:
          type: string
        confidence:
          type: number
          format: float
        status:
          type: string
        superseded_by:
          type: string
          nullable: true
          description: ID of the newer MemoryRecord that replaced this version.
        valid_from:
          type: integer
          format: uint64
        valid_until:
          type: integer
          format: uint64
          nullable: true
        created_at_ms:
          type: integer
          format: uint64
    UpsertEdgeRequest:
      type: object
      required:
      - source_id
      - target_id
      - edge_type
      properties:
        id:
          type: string
          nullable: true
          description: Optional idempotent edge ID. Auto-generated UUID if omitted.
        source_id:
          type: string
        target_id:
          type: string
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        weight:
          type: number
          format: float
          nullable: true
          default: 1.0
        metadata:
          type: object
          nullable: true
    NodeEdgesResponse:
      type: object
      required:
      - memory_id
      - outgoing
      - incoming
      properties:
        memory_id:
          type: string
        outgoing:
          type: array
          items:
            $ref: '#/components/schemas/MemoryEdge'
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/MemoryEdge'
    BeliefHistoryResponse:
      type: object
      required:
      - fact_key
      - versions
      properties:
        fact_key:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/BeliefVersion'
          description: Ordered from newest to oldest. The active version is first.
    CentralityResponse:
      type: object
      required:
      - namespace
      - updated
      properties:
        namespace:
          type: string
        updated:
          type: integer
          description: Number of memory records whose centrality_score was recomputed.

    # ── v3.0.0 schemas ────────────────────────────────────────────────────────

    VectorSearchBatchRequest:
      type: object
      required:
      - queries
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/VectorSearchRequest'
          minItems: 1
          maxItems: 100
          description: Up to 100 search queries executed in parallel via rayon.
    VectorSearchBatchResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/VectorSearchResponse'
          description: One result per query in the same order as the request.

    ScrollItem:
      type: object
      required:
      - id
      - meta
      properties:
        id:
          type: string
        meta:
          type: object
          nullable: true
        vector:
          type: array
          items:
            type: number
            format: float
          nullable: true
          description: Present only when `include_vectors=true`.
    ScrollResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScrollItem'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page. Null when there are no more items.

    RerankRequest:
      type: object
      required:
      - ids
      properties:
        query_text:
          type: string
          nullable: true
          description: Natural-language query. Embedded on the server side. Mutually exclusive with `query_vector`.
        query_vector:
          type: array
          items:
            type: number
            format: float
          nullable: true
          description: Pre-computed query vector. Mutually exclusive with `query_text`.
        ids:
          type: array
          items:
            type: string
          description: IDs to rerank. Must exist in the collection.
    RerankResponse:
      type: object
      required:
      - ranked
      properties:
        ranked:
          type: array
          items:
            type: object
            required:
            - id
            - score
            properties:
              id:
                type: string
              score:
                type: number
                format: float
          description: IDs sorted by cosine similarity descending.

    AggregateRequest:
      type: object
      required:
      - group_by
      properties:
        group_by:
          type: string
          description: Metadata field name to group by.
          example: tax_system
        filter:
          description: Optional typed metadata filter applied before grouping.
          nullable: true
          $ref: '#/components/schemas/MetadataFilter'
        limit:
          type: integer
          nullable: true
          default: 100
          maximum: 1000
          description: Max number of buckets returned.
    AggregationBucket:
      type: object
      required:
      - value
      - count
      properties:
        value:
          type: string
          description: Field value for this bucket.
        count:
          type: integer
          description: Number of vectors in this bucket (after applying filter).
    AggregateResponse:
      type: object
      required:
      - buckets
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/AggregationBucket'
          description: Buckets sorted by count descending.

    MetadataFilter:
      description: >
        Composable typed filter tree. Leaf operators: `eq`, `neq`, `gt`, `gte`, `lt`,
        `lte`, `in`, `not_in`, `any_of`, `contains`, `starts_with`, `exists`.
        Logical combinators: `and`, `or`, `not`.
      type: object
      example:
        field: tax_system
        op: eq
        value: suitetax

    BackupResponse:
      type: object
      required:
      - ok
      - offset
      properties:
        ok:
          type: boolean
        offset:
          type: integer
          format: uint64
          description: WAL offset at the time the snapshot was taken.

    AuditEntry:
      type: object
      required:
      - ts_ms
      - method
      - path
      - status_code
      - latency_ms
      properties:
        ts_ms:
          type: integer
          format: uint64
        api_key_id:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        method:
          type: string
          example: POST
        path:
          type: string
          example: /v1/vector/my-col/search
        status_code:
          type: integer
          example: 200
        latency_ms:
          type: integer
          format: uint64

    ApiKeyRecord:
      type: object
      required:
      - id
      - name
      - role
      - created_at_ms
      properties:
        id:
          type: string
          description: Opaque key identifier (UUID).
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - user
        created_at_ms:
          type: integer
          format: uint64
    CreateApiKeyRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: Production backend
        role:
          type: string
          enum:
          - admin
          - user
          default: user
    CreateApiKeyResponse:
      type: object
      required:
      - id
      - name
      - role
      - key
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        key:
          type: string
          description: The raw API key value. Shown only once — store securely.
          example: rk_live_abc123…
    # ── DiskANN schemas ───────────────────────────────────────────────────────

    DiskAnnBuildParams:
      type: object
      required:
      - max_degree
      - build_threads
      - search_list_size
      properties:
        max_degree:
          type: integer
          description: Maximum out-degree per node in the Vamana graph. Clamped to [4, 1024].
          default: 64
          example: 32
        build_threads:
          type: integer
          description: Number of threads used during index construction.
          default: 4
          example: 4
        search_list_size:
          type: integer
          description: >
            Candidate list size during greedy graph traversal. Larger values improve
            recall at the cost of build time. Clamped to [8, 65535].
          default: 128
          example: 128

    DiskAnnBuildRequest:
      type: object
      description: >
        All fields are optional. Omitted fields fall back to the server's
        `diskann_*` configuration values.
      properties:
        max_degree:
          type: integer
          nullable: true
          example: 32
        build_threads:
          type: integer
          nullable: true
          example: 4
        search_list_size:
          type: integer
          nullable: true
          example: 128

    DiskAnnStatusResponse:
      type: object
      required:
      - available
      - last_built_ms
      - graph_files
      - params
      properties:
        available:
          type: boolean
          description: True when a built DiskANN graph is loaded and ready for queries.
        last_built_ms:
          type: integer
          format: uint64
          description: Unix timestamp (ms) of the last successful build. 0 if never built.
        graph_files:
          type: array
          items:
            type: string
          description: Relative paths of the graph segment files on disk.
        params:
          $ref: '#/components/schemas/DiskAnnBuildParams'

    DiskAnnMutationResponse:
      type: object
      required:
      - ok
      - params
      - status
      properties:
        ok:
          type: boolean
        params:
          $ref: '#/components/schemas/DiskAnnBuildParams'
          description: Effective parameters used for this build/tune operation.
        status:
          $ref: '#/components/schemas/DiskAnnStatusResponse'

    # ── State secondary-index schemas ────────────────────────────────────────

    CreateStateIndexRequest:
      type: object
      required:
      - field
      properties:
        field:
          type: string
          description: >
            JSON field name inside the `value` object to index.
            Must be non-empty and within `max_key_len`.
          example: user_id

    CreateStateIndexResponse:
      type: object
      required:
      - status
      - field
      properties:
        status:
          type: string
          enum:
          - ok
        field:
          type: string
          example: user_id

    # ── Config schemas ────────────────────────────────────────────────────────

    ServerConfig:
      type: object
      description: >
        Full server configuration. All fields are optional on PUT — omitted fields
        keep their current value. A server restart is required for changes to take
        effect. Fields whose names contain `api_key` or `llm_api_key` are sensitive
        and should be treated accordingly.
      properties:
        port:
          type: integer
          default: 8080
          example: 9917
        bind_addr:
          type: string
          example: 0.0.0.0
        api_key:
          type: string
          description: Master bearer token. Write-only — returned masked on GET.
          example: dev
        data_dir:
          type: string
          nullable: true
          example: data
        snapshot_interval_secs:
          type: integer
          format: uint64
          default: 30
        wal_segment_max_bytes:
          type: integer
          format: uint64
          default: 67108864
        wal_retention_segments:
          type: integer
          default: 10
        wal_sync_mode:
          type: string
          enum:
          - per_write
          - group
          default: group
        wal_flush_interval_ms:
          type: integer
          format: uint64
          default: 10
        wal_batch_size:
          type: integer
          default: 64
        request_timeout_secs:
          type: integer
          format: uint64
          default: 30
        max_body_bytes:
          type: integer
          default: 10485760
        index_kind:
          type: string
          enum:
          - HNSW
          - IVF_FLAT_Q8
          - DiskANN
          default: HNSW
        simd_enabled:
          type: boolean
          default: true
        search_threads:
          type: integer
          default: 0
          description: 0 = use all available cores.
        pre_filter_threshold:
          type: integer
          default: 10000
        hnsw_m:
          type: integer
          default: 16
        hnsw_ef_construction:
          type: integer
          default: 200
        hnsw_segment_compaction_enabled:
          type: boolean
          default: false
        hnsw_segment_compaction_threshold:
          type: number
          format: float
          default: 0.5
        hnsw_segment_compaction_interval_secs:
          type: integer
          format: uint64
          default: 60
        ivf_clusters:
          type: integer
          default: 256
        ivf_nprobe:
          type: integer
          default: 32
        q8_refine_topk:
          type: integer
          default: 100
        diskann_max_degree:
          type: integer
          default: 64
        diskann_build_threads:
          type: integer
          default: 4
        diskann_search_list_size:
          type: integer
          default: 128
        embedding_provider:
          type: string
          enum:
          - none
          - mock
          - openai
          - azure
          - cohere
          - huggingface
          - ollama
          default: none
        embedding_model:
          type: string
          example: text-embedding-3-small
        embedding_url:
          type: string
          example: http://localhost:11434
        embedding_dim:
          type: integer
          default: 1536
        embedding_cache_size:
          type: integer
          default: 1024
        embedding_retry_attempts:
          type: integer
          default: 3
        embedding_retry_initial_ms:
          type: integer
          format: uint64
          default: 200
        embedding_azure_api_base:
          type: string
          example: https://my-resource.openai.azure.com
        embedding_azure_deployment:
          type: string
          example: text-embedding-3-small
        embedding_azure_api_version:
          type: string
          default: 2024-02-01
        embedding_cohere_input_type:
          type: string
          enum:
          - search_document
          - search_query
          default: search_document
        llm_provider:
          type: string
          enum:
          - none
          - mock
          - openai
          - ollama
          default: none
        llm_model:
          type: string
          example: gpt-4o-mini
        llm_url:
          type: string
          example: http://localhost:11434
        memory_consolidation_enabled:
          type: boolean
          default: false
        memory_working_ttl_secs:
          type: integer
          format: uint64
          default: 3600
        memory_default_limit:
          type: integer
          default: 10
        memory_fact_promotion_threshold:
          type: number
          format: float
          default: 0.85
        memory_walk_max_hops:
          type: integer
          default: 2
        memory_walk_min_similarity:
          type: number
          format: float
          default: 0.65
        memory_walk_max_nodes:
          type: integer
          default: 40
        memory_centrality_enabled:
          type: boolean
          default: true
        memory_centrality_update_interval_secs:
          type: integer
          format: uint64
          default: 300
        memory_decay_enabled:
          type: boolean
          default: false
        memory_decay_half_life_days:
          type: number
          format: double
          default: 30.0
        memory_decay_archive_threshold:
          type: number
          format: float
          default: 0.1
        memory_decay_interval_secs:
          type: integer
          format: uint64
          default: 3600
        slow_query_threshold_ms:
          type: integer
          format: uint64
          default: 0
          description: Emit a warning log for searches exceeding this latency. 0 = disabled.
        max_collection_vectors:
          type: integer
          default: 0
          description: Maximum vectors per collection. 0 = unlimited.
        cors_allowed_origins:
          type: string
          nullable: true
          description: Comma-separated origin list, or `*`. Null disables CORS headers.

    ConfigUpdateResponse:
      type: object
      required:
      - status
      - message
      properties:
        status:
          type: string
          enum:
          - success
        message:
          type: string
          example: Configuration saved to luma.toml. A server restart is required for changes to take effect.

paths:
  /v1/health:
    get:
      tags:
      - System
      summary: Health check
      responses:
        '200':
          description: Server is healthy
  /v1/metrics:
    get:
      tags:
      - System
      summary: Prometheus-compatible metrics
      responses:
        '200':
          description: Metrics in text format
  /v1/stream:
    get:
      tags:
      - Streaming
      security:
      - bearerAuth: []
      summary: Real-time Event Stream (SSE)
      description: 'Subscribe to database events (upserts, state changes) via Server-Sent
        Events.

        Supports filtering by type, key prefix, and collection.

        '
      parameters:
      - in: query
        name: since
        description: Offset/event_id to replay from. Default 0.
        schema:
          type: integer
          format: uint64
          default: 0
      - in: query
        name: types
        description: Comma-separated event types (e.g., `vector_upserted,state_changed`).
        schema:
          type: string
      - in: query
        name: key_prefix
        description: Filter events by key prefix.
        schema:
          type: string
      - in: query
        name: collection
        description: Filter events by collection name.
        schema:
          type: string
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Stream of events
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized
  /v1/events:
    get:
      tags:
      - Streaming
      security:
      - bearerAuth: []
      deprecated: true
      summary: Legacy SSE alias (Deprecated)
      description: '**DEPRECATED**: Use `/v1/stream` instead.


        Legacy alias where `prefix` maps to `key_prefix`. Does not support `collection`
        filter.

        '
      parameters:
      - in: query
        name: since
        schema:
          type: integer
          format: uint64
          default: 0
      - in: query
        name: types
        schema:
          type: string
      - in: query
        name: prefix
        schema:
          type: string
      responses:
        '200':
          description: text/event-stream
        '401':
          description: Unauthorized
  /search:
    post:
      tags:
      - RAG Search
      summary: High-level Semantic Search
      description: '**DEPRECATED**. Please use the new `LumaDatabase` Level 2 endpoints
        (`/v1/db/{namespace}/search` and `/v1/db/{namespace}/ingest`) which offer
        superior performance, SQL pre-filtering, and automatic chunking.


        Performs a semantic search using a text query.

        Currently uses **mock embeddings** (random deterministic) for testing flows.

        Supports advanced filtering and grouping for RAG.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HighLevelSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HighLevelSearchResponse'
        '500':
          description: Internal Error
      deprecated: true
  /v1/state:
    get:
      tags:
      - State Management
      security:
      - bearerAuth: []
      summary: List keys
      parameters:
      - in: query
        name: prefix
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: List of state items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateItem'
        '401':
          description: Unauthorized
  /v1/state/batch_put:
    post:
      tags:
      - State Management
      security:
      - bearerAuth: []
      summary: Batch put keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operations:
                  type: array
                  items:
                    $ref: '#/components/schemas/StateBatchOperation'
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateBatchResponse'
  /v1/state/{key}:
    get:
      tags:
      - State Management
      security:
      - bearerAuth: []
      summary: Get key value
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateItem'
        '404':
          description: Key not found
    put:
      tags:
      - State Management
      security:
      - bearerAuth: []
      summary: Set key value
      description: Supports Optimistic Locking via `if_revision`.
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStateRequest'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutStateResponse'
        '409':
          description: Revision mismatch (CAS failed)
    delete:
      tags:
      - State Management
      security:
      - bearerAuth: []
      summary: Delete key
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStateResponse'
  /v1/vector:
    get:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: List all collections
      responses:
        '200':
          description: List of collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorCollectionsResponse'
  /v1/vector/{collection}:
    get:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Get collection details
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorCollectionDetailResponse'
        '404':
          description: Collection not found
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Create new collection
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVectorCollectionRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVectorCollectionResponse'
        '409':
          description: Collection already exists
    delete:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Drop a collection and everything in it
      description: 'Irreversible. Removes the manifest, the vector file and any
        DiskANN graph built for it. A collection that does not exist is a 404 rather
        than a silent success, so a typo does not read as a completed delete.

        '
      parameters:
      - name: collection
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Dropped
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '404':
          description: No such collection
  /v1/vector/{collection}/add:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Add vector (fail if exists)
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorAddRequest'
      responses:
        '200':
          description: Added
        '409':
          description: ID already exists
  /v1/vector/{collection}/upsert:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Upsert vector (Insert or Update)
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorAddRequest'
      responses:
        '200':
          description: Upserted
  /v1/vector/{collection}/upsert_batch:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Batch Upsert
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/VectorBatchItem'
      responses:
        '200':
          description: Batch results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorBatchResponse'
  /v1/vector/{collection}/update:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Partial Update
      description: Update vector or metadata for an existing ID. Fails if ID not found.
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorUpdateRequest'
      responses:
        '200':
          description: Updated
        '404':
          description: ID not found
  /v1/vector/{collection}/delete:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Delete vector
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorDeleteRequest'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorDeleteResponse'
        '404':
          description: ID not found
  /v1/vector/{collection}/delete_batch:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Batch Delete
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Batch results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorBatchResponse'
  /v1/vector/{collection}/get:
    get:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Get vector by ID
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      - in: query
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorGetResponse'
        '404':
          description: Not found
  /v1/vector/{collection}/search:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Low-level Vector Search (KNN)
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorSearchResponse'
  /v1/doc/{collection}/{id}:
    put:
      tags:
      - Document Store
      security:
      - bearerAuth: []
      summary: Store document
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Arbitrary JSON document
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocRecord'
    get:
      tags:
      - Document Store
      security:
      - bearerAuth: []
      summary: Retrieve document
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocRecord'
        '404':
          description: Not found
    delete:
      tags:
      - Document Store
      security:
      - bearerAuth: []
      summary: Delete document
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
  /v1/doc/{collection}/find:
    post:
      tags:
      - Document Store
      security:
      - bearerAuth: []
      summary: Find docs by metadata
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  nullable: true
                limit:
                  type: integer
                  default: 20
      responses:
        '200':
          description: Found docs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocFindResponse'
  /v1/meta/{collection}/execute:
    post:
      tags:
      - Meta
      security:
      - bearerAuth: []
      summary: Execute a Meta Engine query
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A flexible query object that specifies type (vector, sql,
                hybrid)
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /v1/db/{namespace}/ingest:
    post:
      tags:
      - LumaDatabase
      security:
      - bearerAuth: []
      summary: Ingest a document using the Unified Hub
      description: Automatically extracts text, chunks it, calls an Embedding provider,
        and saves the vectors, the raw document, and relational metadata synchronously
        with transactional safety.
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  description: The full document text to process and chunk.
                id:
                  type: string
                  description: Optional custom ID for the document. Auto-generated
                    if omitted.
                metadata:
                  type: object
                  description: Metadata attributes to save in SQLite for relational
                    filtering.
      responses:
        '200':
          description: Ingested successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  doc_id:
                    type: string
                  namespace:
                    type: string
        '400':
          description: Bad Request (e.g. dimension mismatch)
        '500':
          description: Internal Server Error (e.g. io_failure_during_transaction)
  /v1/db/{namespace}/search:
    post:
      tags:
      - LumaDatabase
      security:
      - bearerAuth: []
      summary: Hybrid RAG Search
      description: Performs a semantic search with SQL pre-filtering. Automatically
        groups vector chunks and hydrates the full document.
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  description: The semantic question or search terms.
                sql_filter:
                  type: string
                  description: Optional. A valid SQL WHERE clause to pre-filter documents
                    (e.g., "JSON_EXTRACT(metadata, '$.year') = 2024").
                limit:
                  type: integer
                  default: 10
      responses:
        '200':
          description: Search results with grouped snippets
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        score:
                          type: number
                          format: float
                        snippets:
                          type: array
                          items:
                            type: string
                        document:
                          type: object
        '500':
          description: Internal Server Error
  /v1/memory/{namespace}/ingest_event:
    post:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Ingest an episodic memory event
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEventRequest'
      responses:
        '200':
          description: Episodic memory stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecord'
        '500':
          description: Ingest failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/upsert_fact:
    post:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Create or update a semantic memory fact
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertFactRequest'
      responses:
        '200':
          description: Semantic fact stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecord'
        '500':
          description: Upsert failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/upsert_procedure:
    post:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Create or replace a procedural DAG
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProcedureRequest'
      responses:
        '200':
          description: Procedure stored
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Procedure upsert failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/query:
    post:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Query memory across episodic, semantic and procedural layers
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryQueryRequest'
      responses:
        '200':
          description: Memory query response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryQueryResponse'
        '500':
          description: Query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/next_step:
    post:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Resolve the next valid step of a procedure
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NextStepRequest'
      responses:
        '200':
          description: Next procedural step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextStepResponse'
        '500':
          description: Resolution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/timeline/{entity_id}:
    get:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Fetch the episodic timeline for an entity
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      - in: path
        name: entity_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Entity timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '500':
          description: Timeline lookup failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/edges:
    post:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Create a typed edge between two memory records
      description: 'Creates a directed, weighted edge of the graph layer. If an edge
        with the same `id` already exists it is replaced (upsert semantics).

        Auto-created edges: consolidation creates `triggered_by` (episodic → semantic);
        `upsert_fact` on an existing fact creates `supersedes` (new → archived).'
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertEdgeRequest'
      responses:
        '200':
          description: Edge created or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEdge'
        '500':
          description: Edge creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/edges/{memory_id}:
    get:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Get all edges for a memory node
      description: Returns all outgoing and incoming edges of the specified memory record.
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      - in: path
        name: memory_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Outgoing and incoming edges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeEdgesResponse'
        '500':
          description: Lookup failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/edges/{edge_id}/delete:
    post:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Delete a memory edge
      description: Removes a specific edge by its ID. Idempotent — returns 200 even if
        the edge did not exist.
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      - in: path
        name: edge_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Edge deleted (or was already absent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '500':
          description: Deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/beliefs/{fact_key}/history:
    get:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Get belief version history for a fact key
      description: Returns all historical versions of a semantic fact, ordered newest
        first. Every `upsert_fact` that overwrites an existing key appends a new entry
        to this history.
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      - in: path
        name: fact_key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Version history for the belief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeliefHistoryResponse'
        '500':
          description: History lookup failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/memory/{namespace}/graph/centrality:
    post:
      tags:
      - NS-Mem
      security:
      - bearerAuth: []
      summary: Recompute PageRank centrality for the namespace
      description: 'Runs 15 iterations of PageRank (damping 0.85) over positive edges
        (supports, triggered_by, related_to) and writes normalized [0,1] scores back
        to `memory_records.centrality_score`. Scores are used during Semantic Walk BFS
        to boost highly-connected nodes.

        This operation is idempotent and safe to call at any time.'
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Centrality scores recomputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CentralityResponse'
        '500':
          description: Centrality computation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── v3.0.0 vector endpoints ───────────────────────────────────────────────

  /v1/vector/{collection}/search_batch:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Batch vector search (up to 100 queries in parallel)
      description: >
        Executes up to 100 `SearchRequest` objects in parallel using `rayon::par_iter()`.
        Returns one result array per query in the same order as the input.
        Useful for RAG pipelines that fan out many queries in a single round-trip.
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorSearchBatchRequest'
      responses:
        '200':
          description: One result set per query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorSearchBatchResponse'
        '400':
          description: Invalid request (e.g. more than 100 queries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/vector/{collection}/scroll:
    get:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Scroll / cursor-based pagination
      description: >
        Iterates over all vectors in a collection using an opaque lexicographic cursor.
        Use `next_cursor` from the previous response as the `cursor` parameter of the
        next request. Returns an empty `items` array and `next_cursor: null` when
        the collection is exhausted. Suitable for full collection exports.
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        description: Opaque cursor from a previous response. Omit to start from the beginning.
        schema:
          type: string
      - in: query
        name: limit
        required: false
        description: Number of items per page.
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
      - in: query
        name: include_vectors
        required: false
        description: Include the raw vector data in each item.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Page of items with optional next cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrollResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/vector/{collection}/rerank:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Rerank vectors by cosine similarity
      description: >
        Retrieves the stored vectors for the given IDs and re-scores them against
        the query (text or pre-computed vector) using cosine similarity.
        Returns the same IDs sorted by score descending. Useful as a second-stage
        ranker after an ANN search.
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: IDs sorted by cosine similarity descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
        '400':
          description: Invalid request (e.g. both query_text and query_vector provided)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/vector/{collection}/aggregate:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Aggregate / group-by on metadata fields
      description: >
        Groups vectors by a metadata field and returns bucket counts.
        Uses the keyword index fast path (O(1) per bucket) when the field is
        indexed. Falls back to a full scan with `evaluate_filter` for complex
        filter expressions. Supports the same typed `MetadataFilter` as search.
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregateRequest'
            example:
              group_by: tax_system
              filter:
                field: status
                op: eq
                value: active
              limit: 20
      responses:
        '200':
          description: Buckets sorted by count descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── v3.0.0 admin endpoints ────────────────────────────────────────────────

  /v1/admin/backup:
    post:
      tags:
      - Admin
      security:
      - bearerAuth: []
      summary: Force a WAL snapshot
      description: >
        Triggers `engine.force_snapshot()` synchronously, rotating the current WAL
        segment and writing a new `snapshot.json`. Returns the WAL offset at the
        time of the snapshot. Requires admin role.
      responses:
        '200':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResponse'
        '401':
          description: Unauthorized
        '403':
          description: Admin role required

  /v1/admin/resp:
    get:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: RESP activity, broken down by organization
      description: 'Cumulative counters plus the server clock, not a rate. A rate
        needs a window, and a window chosen by the server is a number whose meaning
        the caller cannot see. Poll twice and divide; what you get is exactly what
        happened between the two samples.

        Per-organization connection counts do not sum to the total: a connection is
        counted globally when accepted and attributed to an org only once it
        authenticates.

        Returns 503 when the RESP listener is disabled, rather than zeroes that would
        read as "nobody is using it".

        '
      responses:
        '200':
          description: Activity snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  sampled_at_ms:
                    type: integer
                    format: int64
                  totals:
                    type: object
                    additionalProperties:
                      type: integer
                      format: int64
                  orgs:
                    type: array
                    items:
                      type: object
                      properties:
                        org:
                          type: string
                        connections_open:
                          type: integer
                        connections_total:
                          type: integer
                        commands_total:
                          type: integer
                        errors_total:
                          type: integer
                  note:
                    type: string
        '403':
          description: Admin role required
        '503':
          description: The RESP listener is not running
  /v1/admin/audit:
    get:
      tags:
      - Admin
      security:
      - bearerAuth: []
      summary: Query the audit log
      description: >
        Returns audit log entries from SQLite, ordered by timestamp descending.
        Every authenticated API request is recorded with timestamp, API key ID,
        client IP, HTTP method, path, status code, and latency. Requires admin role.
      parameters:
      - in: query
        name: from_ms
        required: false
        description: Start of the time range (Unix ms, inclusive).
        schema:
          type: integer
          format: uint64
      - in: query
        name: to_ms
        required: false
        description: End of the time range (Unix ms, inclusive).
        schema:
          type: integer
          format: uint64
      - in: query
        name: key
        required: false
        description: Filter by API key ID (exact match).
        schema:
          type: string
      - in: query
        name: limit
        required: false
        description: Maximum number of entries to return.
        schema:
          type: integer
          default: 100
          maximum: 1000
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
        '401':
          description: Unauthorized
        '403':
          description: Admin role required

  # ── v3.0.0 access-control endpoints ──────────────────────────────────────

  /v1/auth/keys:
    get:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: List all API keys
      description: Returns all non-revoked API keys. The raw key value is never returned after creation. Requires admin role.
      responses:
        '200':
          description: List of API key records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyRecord'
        '401':
          description: Unauthorized
        '403':
          description: Admin role required
    post:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Create an API key
      description: >
        Creates a new API key with the given name and role. The raw key is returned
        **only once** in the response — it cannot be retrieved later. Requires admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          description: Key created — save the `key` value now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '401':
          description: Unauthorized
        '403':
          description: Admin role required

  /v1/auth/keys/{id}:
    delete:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Revoke an API key
      description: >
        Permanently revokes the key with the given ID. Any subsequent request
        using that key returns 401. Idempotent — returns 204 even if the key
        was already revoked. Requires admin role.
      parameters:
      - in: path
        name: id
        required: true
        description: Key ID (UUID) as returned by the list or create endpoint.
        schema:
          type: string
      responses:
        '204':
          description: Key revoked
        '401':
          description: Unauthorized
        '403':
          description: Admin role required

  # ── DiskANN endpoints ─────────────────────────────────────────────────────

  /v1/vector/{collection}/diskann/build:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Build DiskANN index
      description: >
        Triggers a full Vamana graph build for the collection. The build runs
        synchronously and may take seconds to minutes depending on collection size
        and `build_threads`. Once complete the index is immediately active for
        approximate search queries.


        All body fields are optional — omitted values fall back to the server's
        `diskann_*` configuration defaults.
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskAnnBuildRequest'
            example:
              max_degree: 32
              build_threads: 4
              search_list_size: 128
      responses:
        '200':
          description: Index built successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskAnnMutationResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Build failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/vector/{collection}/diskann/tune:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Tune DiskANN search parameters
      description: >
        Updates DiskANN search parameters (`search_list_size`, `max_degree`)
        without rebuilding the graph from scratch. Useful to adjust recall/latency
        tradeoffs on an already-built index. A full rebuild is not triggered.
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskAnnBuildRequest'
            example:
              search_list_size: 200
      responses:
        '200':
          description: Parameters applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskAnnMutationResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /v1/vector/{collection}/diskann/status:
    get:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Get DiskANN index status
      description: >
        Returns whether a DiskANN graph is built and loaded for this collection,
        its build timestamp, the list of graph segment files, and the effective
        build parameters.
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskAnnStatusResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  # ── State secondary-index endpoints ──────────────────────────────────────

  /v1/state/indexes:
    post:
      tags:
      - State Management
      security:
      - bearerAuth: []
      summary: Create a secondary index on a state field
      description: >
        Registers a secondary in-memory index on a JSON field inside state values.
        Once created, `GET /v1/state/index/{field}/{value}` performs O(1) lookups
        instead of a full key scan. Indexes survive as long as the server is running
        but are not persisted to disk — recreate them after a restart.


        Creating an index on an already-indexed field is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStateIndexRequest'
            example:
              field: user_id
      responses:
        '200':
          description: Index created (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStateIndexResponse'
        '400':
          description: Invalid field name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized

  /v1/state/index/{field}/{value}:
    get:
      tags:
      - State Management
      security:
      - bearerAuth: []
      summary: Query state by secondary index
      description: >
        Returns all state items whose `value.{field}` equals `{value}`.
        Requires a prior call to `POST /v1/state/indexes` for this field.
        Results are unordered. Use `limit` to cap the result set (max 1000).
      parameters:
      - in: path
        name: field
        required: true
        description: The JSON field name that was indexed.
        schema:
          type: string
        example: user_id
      - in: path
        name: value
        required: true
        description: The exact value to match.
        schema:
          type: string
        example: "42"
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 100
          maximum: 1000
      responses:
        '200':
          description: Matching state items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateItem'
        '401':
          description: Unauthorized

  # ── Config endpoints ──────────────────────────────────────────────────────

  /v1/config:
    get:
      tags:
      - System
      security:
      - bearerAuth: []
      summary: Get current server configuration
      description: >
        Returns the full running configuration of the server. Sensitive fields
        (`api_key`, `llm_api_key`, `embedding_api_key`) are included in the
        response — restrict access to admin users.
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConfig'
        '401':
          description: Unauthorized
    put:
      tags:
      - System
      security:
      - bearerAuth: []
      summary: Update server configuration
      description: >
        Writes the supplied configuration to `luma.toml`. A **server restart**
        is required for changes to take effect — the running process is not
        reconfigured in-place. Only fields present in the body are written;
        however the full `Config` struct is always serialised, so omitting a
        field resets it to its default value. Send `GET /v1/config` first,
        modify the fields you need, then `PUT` the whole object back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerConfig'
            example:
              diskann_max_degree: 48
              diskann_search_list_size: 160
              embedding_provider: openai
              embedding_model: text-embedding-3-small
      responses:
        '200':
          description: Configuration saved — restart required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUpdateResponse'
        '400':
          description: Invalid configuration payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
        '500':
          description: Failed to write luma.toml
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /search/ingest:
    post:
      tags:
      - RAG Search
      security:
      - bearerAuth: []
      summary: Ingest a document into the text search engine
      description: 'Adds one document to the `src/search` engine index. The caller
        supplies the vector: this endpoint does not embed. For text-in/vector-out
        ingestion use `POST /v1/db/{namespace}/ingest` instead.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchIngestRequest'
      responses:
        '200':
          description: Document indexed
        '400':
          description: Invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: Document content exceeds max_body_bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/blob/{bucket}:
    get:
      tags:
      - Object Storage
      security:
      - bearerAuth: []
      summary: List object keys in a bucket
      parameters:
      - in: path
        name: bucket
        required: true
        schema:
          type: string
        description: 'Bucket name. Charset is restricted to `[A-Za-z0-9._-]`;
          `.`, `..` and path separators are rejected.'
      responses:
        '200':
          description: Keys in the bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobListResponse'
        '400':
          description: Invalid bucket name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Bucket not found, or owned by another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/blob/{bucket}/{key}:
    put:
      tags:
      - Object Storage
      security:
      - bearerAuth: []
      summary: Store a binary object
      description: 'Writes the raw request body as an object. The write is atomic
        (temp file + rename), and every path component is validated against
        path traversal.

        '
      parameters:
      - in: path
        name: bucket
        required: true
        schema:
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
        description: 'Object key. May contain `/` to form nested segments; each
          segment is validated independently.'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Object stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobPutResponse'
        '400':
          description: Invalid bucket or key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: Body exceeds max_body_bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    get:
      tags:
      - Object Storage
      security:
      - bearerAuth: []
      summary: Fetch a binary object
      parameters:
      - in: path
        name: bucket
        required: true
        schema:
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Object bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Object not found, or owned by another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags:
      - Object Storage
      security:
      - bearerAuth: []
      summary: Delete a binary object
      parameters:
      - in: path
        name: bucket
        required: true
        schema:
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Object deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobDeleteResponse'
        '404':
          description: Object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/queue/{queue}:
    post:
      tags:
      - Queues
      security:
      - bearerAuth: []
      summary: Enqueue a message
      parameters:
      - in: path
        name: queue
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnqueueRequest'
      responses:
        '200':
          description: Message enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnqueueResponse'
        '400':
          description: Invalid queue name or body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    get:
      tags:
      - Queues
      security:
      - bearerAuth: []
      summary: Queue depth and visible count
      parameters:
      - in: path
        name: queue
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Queue stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatsResponse'
  /v1/queue/{queue}/receive:
    post:
      tags:
      - Queues
      security:
      - bearerAuth: []
      summary: Receive messages (at-least-once)
      description: 'Leases up to `max` messages for `visibility_secs`. A message
        that is not acked before its visibility window expires becomes visible
        again and its `attempts` counter increases — delivery is at-least-once,
        so consumers must be idempotent.

        '
      parameters:
      - in: path
        name: queue
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveRequest'
      responses:
        '200':
          description: Leased messages (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveResponse'
  /v1/queue/{queue}/{id}:
    delete:
      tags:
      - Queues
      security:
      - bearerAuth: []
      summary: Acknowledge (delete) a received message
      parameters:
      - in: path
        name: queue
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Message id returned by receive.
      responses:
        '200':
          description: Message acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueAckResponse'
        '404':
          description: Message not found or already acked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/image/{bucket}/{key}:
    get:
      tags:
      - Images
      security:
      - bearerAuth: []
      summary: Transform a stored image on the fly
      description: 'Resizes (Lanczos3) and/or converts an object that already
        exists in the blob store. The source object is never modified.

        '
      parameters:
      - in: path
        name: bucket
        required: true
        schema:
          type: string
      - in: path
        name: key
        required: true
        schema:
          type: string
      - in: query
        name: w
        schema:
          type: integer
          format: int32
        description: Target width in pixels.
      - in: query
        name: h
        schema:
          type: integer
          format: int32
        description: Target height in pixels.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - png
          - jpeg
        description: Output encoding. Defaults to the source format.
      - in: query
        name: quality
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: JPEG quality. Ignored for png.
      responses:
        '200':
          description: Transformed image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid parameters or unsupported source format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Source object not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/register:
    post:
      tags:
      - Accounts
      summary: Register an organization and its first user
      description: 'Public endpoint. Creates the org and its owner, unless the
        email domain is mapped via `/v1/auth/domain-orgs` — in that case the user
        joins the mapped org with the mapped role instead of creating a new one.
        Passwords are hashed with Argon2id and must be at least 8 characters.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Password shorter than 8 characters, or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Accounts unavailable (SQLite disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/login:
    post:
      tags:
      - Accounts
      summary: Exchange email and password for a session token
      description: 'Public endpoint. Returns an opaque `lums_…` token; only its
        SHA-256 hash is stored server-side, so the token cannot be recovered from
        the database. Default TTL is 7 days.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/logout:
    post:
      tags:
      - Accounts
      security:
      - bearerAuth: []
      summary: Revoke the current session token
      responses:
        '204':
          description: Session revoked
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/refresh:
    post:
      tags:
      - Accounts
      security:
      - bearerAuth: []
      summary: Rotate the current session token
      description: 'Issues a new token and revokes the presented one. The old
        token stops working immediately, so clients must replace it atomically.

        '
      responses:
        '200':
          description: New token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Missing, expired or revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/sessions:
    get:
      tags:
      - Accounts
      security:
      - bearerAuth: []
      summary: List the caller's active sessions
      description: Tokens are never returned — only their metadata.
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
  /v1/auth/sessions/revoke-all:
    post:
      tags:
      - Accounts
      security:
      - bearerAuth: []
      summary: Sign out of every other device
      description: Revokes all of the caller's sessions except the one in use.
      responses:
        '200':
          description: Number of sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAllResponse'
  /v1/auth/my-orgs:
    get:
      tags:
      - Accounts
      security:
      - bearerAuth: []
      summary: Organizations the caller belongs to
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgListResponse'
  /v1/auth/switch-org:
    post:
      tags:
      - Accounts
      security:
      - bearerAuth: []
      summary: Rebind the session to another organization
      description: 'Rotates the token: the old one is revoked and the new one
        carries the role the user holds in the target org. Fails if the caller is
        not a member of it.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchOrgRequest'
      responses:
        '200':
          description: Token rebound to the target org
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchOrgResponse'
        '403':
          description: Caller is not a member of the target organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/access-policy:
    get:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Read the self-registration allow policy
      responses:
        '200':
          description: Allowed domains and emails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
    put:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Replace the self-registration allow policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPolicy'
      responses:
        '200':
          description: Policy saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
        '403':
          description: Requires platform admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/domain-orgs:
    get:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: List email-domain to organization mappings
      responses:
        '200':
          description: Mappings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainOrgListResponse'
    put:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Map an email domain to an organization
      description: 'With a mapping in place, registering with an address in that
        domain joins the mapped org instead of creating a new one. Platform admin
        only.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainOrgRequest'
      responses:
        '204':
          description: Mapping saved
        '403':
          description: Requires platform admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/domain-orgs/{domain}:
    delete:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Remove a domain mapping
      parameters:
      - in: path
        name: domain
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Mapping removed
        '403':
          description: Requires platform admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/keys/{id}/role:
    put:
      tags:
      - Authentication
      security:
      - bearerAuth: []
      summary: Change an API key's role and permissions
      description: 'Targets any key by global id and can set an arbitrary role, so
        it is restricted to platform admins.

        '
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyRoleRequest'
      responses:
        '204':
          description: Key updated
        '403':
          description: Requires platform admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Key id not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/roles:
    get:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: List roles
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '501':
          description: RBAC unavailable (SQLite disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Create a role
      description: 'A role may inherit from a parent, which is how the built-in
        viewer < member < admin < owner ladder is expressed.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '200':
          description: Role created
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/roles/{id}:
    delete:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Delete a role
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Role deleted
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/roles/{id}/permissions:
    get:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: List a role's permissions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
    post:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Grant a permission to a role
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permission'
      responses:
        '200':
          description: Permission granted
    delete:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Revoke a permission from a role
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Permission'
      responses:
        '200':
          description: Permission revoked
  /v1/auth/roles/check:
    get:
      tags:
      - Access Control
      security:
      - bearerAuth: []
      summary: Test whether a role may perform an action
      description: 'Resolves inheritance, so a role inherits its parents''
        permissions. Read-only: it does not grant anything.

        '
      parameters:
      - in: query
        name: role
        required: true
        schema:
          type: string
      - in: query
        name: resource
        required: true
        schema:
          type: string
      - in: query
        name: action
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCheckResponse'
  /v1/admin/stats:
    get:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Usage statistics for the panel dashboard
      description: 'Includes `storage_bytes` when the SQLite file is readable.
        Admin only.

        '
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/admin/audit-events:
    get:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Business audit trail (logins, user and membership changes)
      description: 'Distinct from `GET /v1/admin/audit`, which is the HTTP access
        log. This one records semantic events from `sys_audit_events`.

        '
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
  /v1/admin/orgs:
    get:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: List organizations
      description: 'A tenant-bound admin sees only their own org; a platform admin
        sees all of them.

        '
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgListResponse'
    post:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Create an organization
      description: Platform admin only — creating an org is platform-wide.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        '200':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Requires platform admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/admin/orgs/{id}:
    delete:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Delete an organization
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Organization deleted
        '404':
          description: 'Not found. Returned instead of 403 for an org the caller
            may not touch, so the existence of other organizations is not
            revealed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/admin/orgs/{id}/members:
    get:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: List an organization's members
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
    post:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Add an existing user to the organization
      description: 'Requires the target account to exist already. To create and
        add in one step use `/invite`. A caller cannot grant a role at or above
        their own.

        '
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '200':
          description: Membership added
        '403':
          description: Not an org manager, or role grant above the caller's own
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/admin/orgs/{id}/invite:
    post:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Invite a user in one step
      description: 'If the email already has an account, adds the membership
        (`created: false`). Otherwise creates the account and adds it
        (`created: true`); when no password is supplied a temporary one is
        generated and returned **once** as `temp_password`.

        '
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '200':
          description: Invitation applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '403':
          description: Not an org manager, or role grant above the caller's own
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/admin/orgs/{id}/members/{user_id}:
    put:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Change a member's role in the organization
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '204':
          description: Role updated
        '403':
          description: Role grant at or above the caller's own
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Remove a member from the organization
      description: 'Removing a membership revokes that user''s sessions bound to
        the org, so access stops immediately rather than at token expiry.

        '
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: user_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Member removed
  /v1/admin/users:
    get:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: List users
      description: Scoped to the caller's org unless the caller is a platform admin.
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Create a user
      description: '`org_id` is honored only for platform admins; an org admin
        always creates within their own org. Password must be at least 8
        characters.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Weak password or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/admin/users/{id}:
    delete:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Delete a user
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: User deleted
        '404':
          description: User not found or not visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/admin/users/{id}/role:
    put:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Change a user's role
      description: 'A non-platform admin cannot promote anyone to a role at or
        above their own.

        '
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '204':
          description: Role updated
        '403':
          description: Role grant at or above the caller's own
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/admin/users/{id}/orgs:
    get:
      tags:
      - Administration
      security:
      - bearerAuth: []
      summary: Organizations a user belongs to
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgListResponse'
  /v1/config/embedding/probe:
    post:
      tags:
      - Configuration
      security:
      - bearerAuth: []
      summary: Test an embedding configuration and measure its real dimension
      description: 'Embeds a short probe string with the candidate settings and
        reports the dimension actually returned, which removes the most common
        configuration mistake — hand-typing the wrong `embedding_dim`. Always
        answers 200: `ok:false` carries the provider''s own error message so a
        UI can show it inline instead of as an opaque HTTP failure. Admin only.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingProbeRequest'
      responses:
        '200':
          description: Probe result, successful or not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProbeResponse'
        '403':
          description: Requires admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/vector/{collection}/reindex:
    post:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Re-embed a collection under the current model
      description: 'Starts a background job that re-embeds every vector with the
        currently configured embedding model, writing the result into a **new**
        collection.


        Returns 202 immediately with a job id: re-embedding is bounded by the
        provider''s throughput, so holding the request open would tie the outcome
        to a single HTTP timeout.


        It writes to a new collection rather than rewriting in place because a
        collection''s dimension is fixed in its manifest and a new model usually
        has a different one — rewriting in place would mean dropping the source
        first, and a provider failure halfway through would then leave nothing to
        fall back to. Verify the new collection, then swap.


        Vectors whose metadata carries no chunk text are reported in
        `skipped_no_text` and left behind: collections filled through the
        raw-vector API never stored the source text, so there is nothing to
        re-embed.

        '
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReindexRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexStartResponse'
        '400':
          description: Target equals source, or the name is too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Source collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/vector/{collection}/reindex/{job_id}:
    get:
      tags:
      - Vector Operations
      security:
      - bearerAuth: []
      summary: Poll a reindex job
      parameters:
      - in: path
        name: collection
        required: true
        schema:
          type: string
      - in: path
        name: job_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexProgress'
        '404':
          description: No job with that id. Progress is not retained forever.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
