name: Build arm64

# The current main as a Linux arm64 binary, for testing on an arm64 machine
# (scripts/sysrq/run.sh with HOST, the 72 h soak). Releases build from tags.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin luma --locked
      - uses: actions/upload-artifact@v4
        with:
          name: luma-linux-arm64
          path: target/release/luma
          retention-days: 7
