name: Durability against other engines

# The same power-cut harness (LazyFS) and the same workload against Luma, Redis,
# PostgreSQL, etcd and SQLite: what "on par with other engines" means in
# numbers. The lossy settings (Redis appendfsync everysec, Postgres
# synchronous_commit=off, SQLite synchronous=NORMAL) are the control that the
# cuts are deep enough to lose data. See
# scripts/apagon/comparar.sh.

on:
  workflow_dispatch:
    inputs:
      engines:
        description: 'JSON list, e.g. ["luma","redis-always"]. Empty runs all.'
        required: false
        default: ""
  schedule:
    - cron: "11 5 * * 0"

jobs:
  compare:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(inputs.engines || '["luma","redis-always","redis-everysec","pg-on","pg-off","etcd","sqlite-full","sqlite-normal"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        if: matrix.engine == 'luma'
        uses: dtolnay/rust-toolchain@stable
      - name: Build Luma
        if: matrix.engine == 'luma'
        run: cargo build --release --bin luma --locked
      - name: LazyFS image with the other engines
        run: docker build -q -t luma-apagon scripts/apagon
      - name: Binary under test
        if: matrix.engine == 'luma'
        run: mkdir -p bin && cp target/release/luma bin/
      - name: 15 power cuts
        run: >-
          docker run --rm --privileged --device /dev/fuse -e CYCLES=15
          -v "$PWD/bin:/luma" -v "$PWD/scripts/apagon:/apagon" luma-apagon
          bash /apagon/comparar.sh ${{ matrix.engine }}
