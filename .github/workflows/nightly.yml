name: Nightly Resilience

# F4.5 of docs/PLAN-MAESTRO.md. The heavy half of the resilience work: the
# checks that are too slow to run on every push but whose absence is how a
# durability regression reaches a release.
#
# The plan sets the bar for dropping the "experimental" label from the RESP
# listener at **seven consecutive green nights**. That is a judgement about this
# workflow, so it is stated here rather than only in the plan.

on:
  schedule:
    # 03:17 UTC — off the hour, because everyone else's cron runs on it and a
    # queued runner is a nightly that silently did not happen.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  crash-matrix:
    name: Crash-recovery matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Kill the real binary, many times, per engine
        env:
          # The push build does two iterations, which catches a systematic
          # durability bug. Timing-dependent ones only show up over many.
          LUMA_CRASH_ITERATIONS: '200'
        run: cargo test --test crash_recovery --release --locked -- --test-threads=1

  atomicity:
    name: Multi-key atomicity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      # The WAL record that makes RPOPLPUSH atomic, replayed torn and intact.
      # Cheap, but it guards the guarantee kombu's unacked queue is built on.
      - run: cargo test --test atomic_move --release --locked

  parser-fuzz:
    name: Parser fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seeded sweep first
        # The deterministic sweep from the push build, so a nightly failure is
        # never ambiguous about which of the two found it.
        run: cargo test --test resp_fuzz --release --locked
      - name: Real fuzzing
        # A seeded generator explores the neighbourhood of what we thought of.
        # This explores what we did not. Ten minutes is a nightly, not a
        # campaign — a longer run belongs in a dedicated job when something
        # looks suspicious.
        run: |
          if [ -d fuzz ]; then
            cargo fuzz run resp_decode -- -max_total_time=600
          else
            echo "::notice::no fuzz/ target yet; the seeded sweep ran instead"
          fi

  differential:
    name: RESP differential, extended
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Compare against Redis 7
        env:
          LUMA_DIFF_REDIS: 127.0.0.1:16379
        run: cargo test --test redis_differential --release --locked -- --ignored

  clients:
    name: Client E2E, both targets
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install redis celery arq
      - run: cargo build --release --locked
      - name: Start Luma with the RESP listener
        run: |
          mkdir -p e2e-data
          cat > luma.toml <<'EOF'
          port = 18080
          bind_addr = "127.0.0.1"
          data_dir = "e2e-data"
          resp_port = 16380
          resp_allow_flush = true
          embedding_provider = "mock"
          EOF
          LUMA_API_KEY= LUMA_ALLOW_INSECURE=1 LUMA_MASTER_KEY=nightly-key \
            ./target/release/luma serve > luma.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/16380) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'the RESP port never opened'; cat luma.log; exit 1
      - run: |
          python tests/e2e/clients.py \
            --redis redis://127.0.0.1:16379/0 \
            --luma redis://127.0.0.1:16380/0
      - name: Server log on failure
        if: failure()
        run: cat luma.log

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # Nightly as well as on push: an advisory is published on someone else's
      # schedule, not on ours, so a dependency that was clean at merge time can
      # be vulnerable by morning without a single commit.
      - run: cargo audit

  summary:
    name: Nightly result
    needs: [crash-matrix, atomicity, parser-fuzz, differential, clients, audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::the nightly is red — the seven-green-nights counter for \
            dropping the RESP experimental label resets"
            exit 1
          fi
          echo "nightly green"
