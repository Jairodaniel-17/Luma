name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, unlike every other job here, and that is the point. `-D warnings`
      # on a floating `stable` means each Rust release can turn this red without
      # anybody touching the code — which is exactly what happened: a new stable
      # added `chunks_exact_to_as_chunks` and put nine pre-existing lines in
      # error. A lint gate that fires on a calendar is not a gate, it is an
      # outage on a schedule.
      #
      # Bumping this is a deliberate one-line change, and the new lints get
      # fixed in that commit instead of blocking whatever unrelated work was in
      # flight.
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --verbose --locked
      - name: Run tests
        run: cargo test --verbose --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88
      - name: Check compilation on MSRV
        run: cargo check --all-features --locked

  deny:
    name: Dependency Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run audit
        run: cargo audit

  bench-compile:
    name: Bench Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Check bench compilation
        run: cargo bench --no-run --locked

  redis-differential:
    name: RESP Differential vs Redis 7
    runs-on: ubuntu-latest
    # `docs/SPEC-resp.md` names a real Redis the source of truth for RESP
    # semantics, not our own tests. The first run of this suite found 13
    # divergences the in-tree tests could not catch, because they encoded the
    # same wrong model as the code.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Compare against Redis 7
        env:
          LUMA_DIFF_REDIS: 127.0.0.1:16379
        # The test asserts the variable is set, so a service that failed to
        # start fails the job instead of skipping silently.
        run: cargo test --test redis_differential --locked -- --ignored
  client-e2e:
    name: Celery / arq / redis-py E2E
    runs-on: ubuntu-latest
    # The adoption milestone of docs/PLAN-MAESTRO.md (F3.4). Everything else
    # verifies RESP against tests we wrote, which encode our understanding of
    # Redis; this runs the libraries a user would actually install. Its first
    # run found that a PUBLISH queued inside MULTI was rejected, which made a
    # real Celery worker execute a task and then hang forever.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the real clients
        run: pip install redis celery arq
      - name: Build Luma
        run: cargo build --release --locked
      - name: Start Luma with the RESP listener
        run: |
          mkdir -p e2e-data
          cat > luma.toml <<'EOF'
          port = 18080
          bind_addr = "127.0.0.1"
          data_dir = "e2e-data"
          resp_port = 16380
          resp_allow_flush = true
          embedding_provider = "mock"
          EOF
          # No password: the harness sends the same commands to both peers,
          # and an AUTH that only one of them needs is not the same command.
          LUMA_API_KEY= LUMA_ALLOW_INSECURE=1 LUMA_MASTER_KEY=ci-e2e-key \
            ./target/release/luma serve > luma.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/16380) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'the RESP port never opened'; cat luma.log; exit 1
      - name: Run the client suite
        run: |
          python tests/e2e/clients.py \
            --redis redis://127.0.0.1:16379/0 \
            --luma redis://127.0.0.1:16380/0
      - name: Server log on failure
        if: failure()
        run: cat luma.log
  ioredis-e2e:
    name: ioredis (Node) against Redis 7 and Luma
    runs-on: ubuntu-latest
    # The README promises ioredis works and nothing had ever run it. The first
    # run found three protocol bugs the 327-command differential could not see:
    # `HELLO` ignored its own AUTH clause, its reply was a RESP3 map on a RESP2
    # connection, and `PING` did not change shape inside a subscription. ioredis
    # does its own RESP parsing, pipelining and reconnects, which is exactly
    # where a reimplementation diverges.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install ioredis
      - name: Build Luma
        run: cargo build --release --locked
      - name: Start Luma with the RESP listener
        env:
          LUMA_API_KEY: ci-resp-e2e-key-long-enough
          LUMA_MASTER_KEY: ci-resp-master-key
          RESP_PORT: '16380'
          RESP_ALLOW_FLUSH: '1'
          DATA_DIR: resp-e2e-data
          PORT_LUMA_VDB: '18081'
        run: |
          ./target/release/luma serve > luma.log 2>&1 &
          for _ in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/16380) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'the RESP port never opened'; cat luma.log; exit 1
      - name: ioredis against both
        run: |
          node tests/e2e/ioredis_client.mjs \
            --redis redis://127.0.0.1:6379/0 \
            --luma  redis://:ci-resp-e2e-key-long-enough@127.0.0.1:16380/0
      - name: Server log on failure
        if: failure()
        run: cat luma.log

  s3-e2e:
    name: S3 API against boto3
    runs-on: ubuntu-latest
    # W3.2. This suite existed and was never wired into CI, which is how a
    # check that passed *with the bug still present* went unnoticed: boto3
    # declined to send a chunk-framed body, so the test exercised nothing.
    # `s3_chunked.py` builds that request by hand for exactly that reason, and
    # both suites run here so neither can rot again.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install boto3
        run: pip install boto3
      - name: Build Luma
        run: cargo build --release --locked
      # The key is set here rather than read from the bootstrap log line. It has
      # to be *strong*: the server refuses to start on a weak or empty
      # `api_key`, which is exactly what happened the first time this job ran —
      # it passed locally only because that developer's shell already exported
      # `LUMA_API_KEY`.
      - name: Start Luma with the S3 listener
        env:
          LUMA_API_KEY: ci-s3-e2e-key-long-enough-to-pass
          LUMA_MASTER_KEY: ci-s3-master-key
        run: |
          cat > luma.toml <<'EOF'
          port = 18080
          bind_addr = "127.0.0.1"
          data_dir = "s3-e2e-data"
          s3_port = 19000
          embedding_provider = "mock"
          EOF
          ./target/release/luma serve > luma.log 2>&1 &
          for _ in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/19000) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'the S3 port never opened'; cat luma.log; exit 1
      - name: Object operations, ETags and presigned URLs
        run: |
          python tests/e2e/s3_client.py \
            --admin http://127.0.0.1:18080 \
            --s3 http://127.0.0.1:19000 \
            --api-key ci-s3-e2e-key-long-enough-to-pass
      - name: Chunk-framed uploads
        run: |
          python tests/e2e/s3_chunked.py \
            --admin http://127.0.0.1:18080 \
            --s3 http://127.0.0.1:19000 \
            --api-key ci-s3-e2e-key-long-enough-to-pass
      # Real sizes and two clients at once — the two things `docs/integrar/S3.md`
      # listed as untested. They were not merely uncovered: the first run found
      # that the S3 router had no body limit of its own, so it inherited axum's
      # 2 MiB default and closed the connection on any larger part, and that
      # `Range` was not read at all, so every ranged GET returned the whole
      # object. 64 MiB rather than the 1 GiB this suite can do, because a CI
      # runner should not spend four minutes proving a cliff that shows up at 8.
      - name: Large uploads and concurrency
        run: |
          cd tests/e2e && python s3_scale.py \
            --admin http://127.0.0.1:18080 \
            --s3 http://127.0.0.1:19000 \
            --api-key ci-s3-e2e-key-long-enough-to-pass \
            --size-mb 64
      - name: Server log on failure
        if: failure()
        run: cat luma.log

  ivf-recall:
    name: IVF recall at 1M vectors
    runs-on: ubuntu-latest
    # This suite is behind the `ivf_stress_tests` feature, and the `test` job
    # runs `cargo test --locked` without `--all-features`. So it never ran here,
    # and a recall bug that emptied the top-5 after a retrain sat undetected: the
    # q8 candidate pre-ranking used raw dot on a Cosine collection, discarding
    # the right answers before anything scored them exactly.
    #
    # Its own job because it needs the feature flag, and in release because that
    # is the difference between 12 seconds and about 200.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the IVF stress suite
        run: cargo test --release --locked --features ivf_stress_tests --test vector_ivf

  admin-ui:
    name: Admin panel is in sync
    runs-on: ubuntu-latest
    # `ui/dist` is committed and embedded into the binary with rust-embed, so
    # the panel a user sees is the *built* output, not the source. Editing
    # `admin-ui/src` and forgetting to rebuild changes nothing at runtime and
    # nothing in the test suite: the change simply does not happen, silently.
    #
    # The vite build is deterministic (content-hashed filenames), so rebuilding
    # and diffing is a real check rather than a coin toss.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Install
        working-directory: admin-ui
        run: npm ci
      - name: Build
        working-directory: admin-ui
        run: npm run build
      - name: The committed bundle must match the source
        run: |
          if ! git diff --quiet -- ui/dist; then
            echo '::error::ui/dist is stale: admin-ui/src changed without a rebuild.'
            echo 'Run `npm run build` in admin-ui/ and commit ui/dist.'
            git diff --stat -- ui/dist
            exit 1
          fi
          echo 'the committed bundle matches the source'
  all-checks:
    name: All Checks Passed
    needs: [fmt, clippy, test, msrv, deny, audit, bench-compile, redis-differential, client-e2e, s3-e2e, ioredis-e2e, ivf-recall, admin-ui]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI checks passed"
