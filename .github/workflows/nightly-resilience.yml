name: Nightly Resilience

# W1.1 of docs/PLAN-MAESTRO.md. The regular CI run does two crash iterations per
# engine, which is enough to catch a systematic durability bug. This job runs the
# heavy version: many more iterations, so a kill lands at many more points in
# each write path and timing-dependent losses have a chance to show up.
#
# It is deliberately separate from `ci.yml`: it takes minutes, not seconds, and a
# flake here must not block a merge. The GA criterion in SPEC-producto is this
# job green for a stretch of consecutive days, so it needs its own history.

on:
  schedule:
    # 03:17 UTC — an odd minute, to stay off the top-of-hour runner rush.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Crash iterations per engine"
        required: false
        default: "100"

env:
  CARGO_TERM_COLOR: always

jobs:
  crash-recovery:
    name: Crash recovery matrix
    runs-on: ubuntu-latest
    # A hung server would otherwise sit here until the account default expires.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Build the binary under test
        # The harness spawns the real `luma` binary, so it has to exist before
        # the test starts rather than being built by it.
        run: cargo build --bin luma --locked
      - name: Crash recovery matrix
        env:
          LUMA_CRASH_ITERATIONS: ${{ github.event.inputs.iterations || '100' }}
        # Two threads: each iteration runs a server process, and oversubscribing
        # the runner makes health-check timeouts look like durability failures.
        run: cargo test --test crash_recovery --locked -- --test-threads=2

  durability-invariants:
    name: Durability invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Blob and queue durability
        run: cargo test --test durability_blob_queue --locked
      # Two invocations, not one: `cargo test` takes a single filter, and
      # `cargo test --lib pathsafe durability` fails with "unexpected argument
      # 'durability'". It did so on this job's very first run — the nightly had
      # never actually executed, so a broken command line sat here unnoticed
      # since the day it was written.
      - name: Path containment
        run: cargo test --lib --locked pathsafe
      - name: Atomic and durable writes
        run: cargo test --lib --locked durability

  forward-compatibility:
    name: Reads what the last release wrote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Golden data_dir fixture
        # Rule 4 of the data compatibility policy: if this branch cannot read a
        # data_dir produced by the last published release, the build fails.
        run: cargo test --test golden_data_dir --locked

  # ── Added with F4.5 ────────────────────────────────────────────────────────
  #
  # These live here rather than in a second nightly workflow. A duplicate was
  # created by accident and then folded in: two workflows on the same cron
  # means twice the runner cost for one answer, and the GA criterion in the
  # plan is "this job green for N consecutive days" — which needs one history,
  # not two.

  atomicity:
    name: Multi-key atomicity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      # The WAL record that makes RPOPLPUSH atomic, replayed torn and intact.
      # Cheap, but it guards the guarantee kombu's unacked queue is built on.
      - run: cargo test --test atomic_move --release --locked
      # And the same questions asked per WAL record type, which is where the
      # answers actually differ: each type has its own apply arm, and a type
      # with no arm replays as nothing at all.
      - run: cargo test --test wal_record_matrix --release --locked

  parser-fuzz:
    name: Parser fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seeded sweep first
        # The deterministic sweep from the push build, so a nightly failure is
        # never ambiguous about which of the two found it.
        run: cargo test --test resp_fuzz --release --locked
      - name: Real fuzzing
        # A seeded generator explores the neighbourhood of what we thought of.
        # This explores what we did not. Ten minutes is a nightly, not a
        # campaign — a longer run belongs in a dedicated job when something
        # looks suspicious.
        run: |
          if [ -d fuzz ]; then
            cargo fuzz run resp_decode -- -max_total_time=600
          else
            echo "::notice::no fuzz/ target yet; the seeded sweep ran instead"
          fi

  differential:
    name: RESP differential, extended
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Compare against Redis 7
        env:
          LUMA_DIFF_REDIS: 127.0.0.1:16379
        run: cargo test --test redis_differential --release --locked -- --ignored

  clients:
    name: Client E2E, both targets
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install redis celery arq
      - run: cargo build --release --locked
      - name: Start Luma with the RESP listener
        run: |
          mkdir -p e2e-data
          cat > luma.toml <<'EOF'
          port = 18080
          bind_addr = "127.0.0.1"
          data_dir = "e2e-data"
          resp_port = 16380
          resp_allow_flush = true
          embedding_provider = "mock"
          EOF
          LUMA_API_KEY= LUMA_ALLOW_INSECURE=1 LUMA_MASTER_KEY=nightly-key \
            ./target/release/luma serve > luma.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/16380) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'the RESP port never opened'; cat luma.log; exit 1
      - run: |
          python tests/e2e/clients.py \
            --redis redis://127.0.0.1:16379/0 \
            --luma redis://127.0.0.1:16380/0
      - name: Server log on failure
        if: failure()
        run: cat luma.log

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # Nightly as well as on push: an advisory is published on someone else's
      # schedule, not on ours, so a dependency that was clean at merge time can
      # be vulnerable by morning without a single commit.
      - run: cargo audit

  summary:
    name: Nightly result
    needs:
      [
        crash-recovery,
        durability-invariants,
        forward-compatibility,
        atomicity,
        parser-fuzz,
        differential,
        clients,
        audit,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::the nightly is red — the seven-green-nights counter for \
            dropping the RESP experimental label resets"
            exit 1
          fi
          echo "nightly green"

