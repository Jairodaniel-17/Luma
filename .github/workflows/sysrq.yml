name: Reboots without sync

# SPEC-friochap CA-2: 50 real `echo b > /proc/sysrq-trigger` reboots under
# load, in a Debian 13 VM with Luma under the production unit, and not a single
# confirmed write lost. One build, then five VMs of ten reboots, each job under
# 15 minutes. See scripts/sysrq/run.sh.
#
# x86_64: GitHub's arm64 runners have no KVM, and emulated QEMU did not finish
# a single boot in 15 min. The sysrq path (ext4, block layer, fsync) is the
# same kernel code on both; what is arm64-specific, the memory model, is
# covered by the test-arm64 job in CI. The same script on an arm64 VM with KVM
# (an A1) runs it there.

on:
  workflow_dispatch:
  schedule:
    # Sundays 04:41 UTC: weekly is enough for the kernel path, the nightly
    # LazyFS cuts cover the engine every day.
    - cron: "41 4 * * 0"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin luma --locked
      # The Debian image (~400 MB), downloaded once here and cached for the
      # five VMs: from cloud.debian.org one VM spent its whole 15 min on it.
      - uses: actions/cache@v4
        with:
          path: /tmp/sysrq/base.qcow2
          key: debian-13-genericcloud-amd64-v1
      - name: Debian image
        run: |
          mkdir -p /tmp/sysrq
          [ -f /tmp/sysrq/base.qcow2 ] || curl -sfL --retry 3 -o /tmp/sysrq/base.qcow2             https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
      - uses: actions/upload-artifact@v4
        with:
          name: luma-linux
          path: target/release/luma
          retention-days: 1

  reboots:
    name: sysrq reboots (${{ matrix.vm }}/5)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: luma-linux
          path: bin
      - uses: actions/cache/restore@v4
        with:
          fail-on-cache-miss: true
          path: /tmp/sysrq/base.qcow2
          key: debian-13-genericcloud-amd64-v1
      - name: QEMU and cloud-init tools
        # Without recommends: a slow mirror took 13 min over the full set.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
      - name: 10 reboots under load
        run: chmod +x bin/luma && CYCLES=10 bash scripts/sysrq/run.sh bin/luma
      - name: VM console on failure
        if: failure()
        run: |
          grep -nE "Linux version|reboot|panic|Oops|BUG:|sysrq|watchdog" /tmp/sysrq/console.log | tail -40 || true
          tail -40 /tmp/sysrq/console.log || true
