name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Binary builds ─────────────────────────────────────────────────────────
  build:
    name: Build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Cap EVERY matrix leg (incl. macOS) so a stuck build can never run for hours
    # and trip abuse detection / freeze the account. A clean build is ~20-40 min.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — glibc (most compatible, main download)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            binary: luma

          # Linux x86_64 — musl (fully static, works in Alpine / Docker scratch)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
            binary: luma
            use_cross: true

          # Linux ARM64 — AWS Graviton 2/3, Raspberry Pi 4/5
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            binary: luma
            use_cross: true

          # macOS Apple Silicon — M1/M2/M3/M4, native.
          # (macOS Intel / macos-13 se quitó: su runner queda en cola sin asignar
          #  para esta cuenta y dejaba el run corriendo 24h. Los Mac Intel pueden
          #  usar este binario ARM vía Rosetta 2 o compilar localmente.)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            binary: luma

          # Windows x86_64 — installer-friendly EXE
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            binary: luma.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross (cross-compilation)
        if: matrix.use_cross == true
        uses: taiki-e/install-action@cross

      - name: Build (native)
        if: matrix.use_cross != true
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }} || true

      - name: Compute archive name
        id: pkg
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="luma-${VERSION}-${{ matrix.target }}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "file=${NAME}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz — Linux / macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp README.md dist/ 2>/dev/null || true
          cp luma.toml dist/luma.toml.example 2>/dev/null || true
          cp docs/ dist/docs/ -r 2>/dev/null || true
          tar -czf ${{ steps.pkg.outputs.file }} -C dist .

      - name: Package (zip — Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" dist\
          if (Test-Path README.md)  { Copy-Item README.md dist\ }
          if (Test-Path luma.toml) { Copy-Item luma.toml dist\luma.toml.example }
          Compress-Archive -Path dist\* -DestinationPath ${{ steps.pkg.outputs.file }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.file }}
          retention-days: 7

  # ── Container image, SBOM and signatures ───────────────────────────────────
  #
  # W5.3 of docs/PLAN-MAESTRO.md. The image was already `FROM scratch` (see
  # Dockerfile); what was missing is that nothing published it, nothing
  # described what was inside it, and nothing let a user check that the thing
  # they pulled is the thing this repository built.
  #
  # Keyless signing (Sigstore OIDC) rather than a long-lived key: a signing key
  # in a repository secret is a key that leaks with the secret, and rotating it
  # invalidates every past signature. Keyless ties the signature to *this*
  # workflow in *this* repository at that commit, which is the claim a consumer
  # actually wants to verify.
  container:
    name: Image, SBOM and signature
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Required for keyless cosign: the workflow exchanges an OIDC token for
      # a short-lived certificate.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercased)
        id: name
        # GHCR rejects uppercase, and a repository owner with a capital letter
        # would fail the push at the very end of a long build.
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          # Digest, not tag, is what gets signed below: a tag can be moved.
          provenance: true
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate the SBOM
        # SPDX rather than the syft-native format: it is what license and
        # vulnerability tooling reads without a converter.
        run: |
          syft "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}" \
            -o spdx-json=luma-sbom.spdx.json
          echo '=== SBOM package count ==='
          python3 -c "import json;print(len(json.load(open('luma-sbom.spdx.json'))['packages']))"

      - name: Sign the image
        run: |
          cosign sign --yes \
            "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Attach the SBOM as a signed attestation
        # Attached to the digest and signed, so the SBOM cannot be swapped for
        # one describing a different image. An unsigned SBOM sitting next to a
        # release file is a document, not evidence.
        run: |
          cosign attest --yes \
            --predicate luma-sbom.spdx.json \
            --type spdxjson \
            "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Verify what we just published
        # Not ceremony: it catches the case where signing appeared to succeed
        # but produced something no consumer can verify, which is worse than
        # not signing at all because it looks safe.
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Hand the SBOM to the release job
        # An artifact rather than a direct upload: `action-gh-release` creates the
        # release if it is missing, so two jobs publishing in parallel race to
        # create it. The release job already collects every artifact.
        uses: actions/upload-artifact@v4
        with:
          name: luma-sbom
          path: luma-sbom.spdx.json
          retention-days: 7
  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    # Waits for the container job too, so the SBOM is among the assets rather
    # than arriving after the release was already published.
    needs: [build, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # `pattern` is not tidiness, it is the fix for the failure that stopped
      # v4.25.1 from publishing. `docker/build-push-action` uploads a build
      # record of its own named `<owner>~<repo>~<id>.dockerbuild`, and
      # downloading everything picked it up too — it failed after 5 retries and
      # took the whole job with it, after the six real artifacts had already
      # downloaded fine. It is not release material either way.
      - name: Download the release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: luma-*

      - name: Flatten & checksum
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "=== release assets ==="
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

