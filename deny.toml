[graph]
# Don't emit warnings for dev-only crates
exclude-dev = false

# ──────────────────────────────────────────
# Advisories: block vulnerabilities, allow known warnings
# ──────────────────────────────────────────
[advisories]
version = 2
# Ignore known warnings for maintained/low-risk advisories:
#   RUSTSEC-2025-0141 — bincode unmaintained (transitive via hnsw_rs; migration planned)
#   RUSTSEC-2026-0002 — lru IterMut unsound (not used via IterMut internally)
#   RUSTSEC-2026-0097 — rand unsound with custom logger (no custom logger in this codebase)
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0097",
    "RUSTSEC-2026-0173",
]

# ──────────────────────────────────────────
# Licenses: allow permissive and weak-copyleft
# ──────────────────────────────────────────
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

# ──────────────────────────────────────────
# Bans: prevent duplicate versions and known-bad crates
# ──────────────────────────────────────────
[bans]
multiple-versions = "warn"
deny = []

# ──────────────────────────────────────────
# Sources: only allow crates.io and this repo
# ──────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
