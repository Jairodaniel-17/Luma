[graph]
# Don't emit warnings for dev-only crates
exclude-dev = false

# ──────────────────────────────────────────
# Advisories: block vulnerabilities, allow known warnings
# ──────────────────────────────────────────
[advisories]
version = 2
# Ignore only unmaintained/unsound advisories with no available fix and no
# reachable impact in this codebase. All actual vulnerabilities are patched by
# keeping deps current (anyhow, crossbeam-epoch, quinn-proto, quick-xml, lopdf,
# memmap2), so none are ignored here.
#   RUSTSEC-2025-0141 — bincode unmaintained (transitive via hnsw_rs)
#   RUSTSEC-2025-0134 — rustls-pemfile unmaintained (transitive via TLS stack)
#   RUSTSEC-2026-0097 — rand unsound only with a custom logger (none here)
#   RUSTSEC-2026-0173 — proc-macro-error2 unmaintained (build-time only, via validator)
#   RUSTSEC-2026-0192 — ttf-parser unmaintained (transitive via image; not on any
#                       untrusted-input path — Luma decodes PNG/JPEG, not fonts)
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0097",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0192",
]

# ──────────────────────────────────────────
# Licenses: allow permissive and weak-copyleft
# ──────────────────────────────────────────
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # `Unicode-DFS-2016` y `OpenSSL` estaban aquí y ya no los trae nada: se
    # quitan en vez de dejarlos. Permitir de antemano una licencia que ningún
    # dependiente usa no es inofensivo — deja pasar en silencio, por ejemplo, a
    # un crate enlazado contra OpenSSL en un stack que es rustls entero.
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    # Las trae `fjall`, la proyección KV, y las dos son permisivas y aprobadas
    # por la OSI: `0BSD` en `varint-rs` (BSD de cero cláusulas: más permisiva
    # que MIT, sin obligación de atribución) y `BSL-1.0` en `xxhash-rust`
    # (Boost, también FSF Free/Libre).
    "0BSD",
    "BSL-1.0",
]

# ──────────────────────────────────────────
# Bans: prevent duplicate versions and known-bad crates
# ──────────────────────────────────────────
[bans]
multiple-versions = "warn"
deny = []

# ──────────────────────────────────────────
# Sources: only allow crates.io and this repo
# ──────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
